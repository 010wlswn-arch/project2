<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 애니메이션 관련 메서드</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <h1>[ jQuery 애니메이션 관련 메서드 ]</h1>

    <ol>
        <li>$("대상").fadeIn();</li>
        <li>$("대상").fadeOut();</li>
        <li>$("대상").fadeToggle();</li>
        <li>$("대상").slideUp();</li>
        <li>$("대상").slideDown();</li>
        <li>$("대상").slideToggle();</li>
        <li>$("대상").animate();</li>
    </ol>

    <!-- 버튼 영역 -->
    <div class="button-wrap">
<button id="btn1">fadeIn</button>
<button id="btn2">fadeOut</button>
<button id="btn3">fadeToggle</button>
<button id="btn4">slideUp</button>
<button id="btn5">slideDown</button>
<button id="btn6">slideToggle</button>
<button id="btn7">ani1</button>
<button id="btn8">ani2</button>
        
    </div>

    <hr>

    <!-- 첫 번째 박스 영역 -->
    <div class="box-wrap">
        <div class="box box1">fadeIn / fadeOut</div>
        <div class="box box2">fadeToggle</div>
         <div class="box box-empty"></div>
    </div>

    <!-- 두 번째 박스 영역 -->
    <div class="box-wrap second">
        <div class="box box3">slideUp / slideDown</div>
        <div class="box box4">slideToggle</div>
        <div class="box box5">Animation</div>
    </div>
<script src="./js/jquery-4.0.0.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
