<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>차박 캠핑 APP</title>

    <style>
        /* =========================
           기본 설정
        ========================= */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            min-height:100%;
        }

        body{
            font-family:
                "Pretendard",
                "Noto Sans KR",
                "맑은 고딕",
                sans-serif;

            color:#111;
            background:#fff;
        }

        body.menu-open{
            overflow:hidden;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        button{
            font:inherit;
            border:0;
            background:none;
            cursor:pointer;
        }

        img{
            display:block;
            max-width:100%;
        }

        ul,
        li{
            list-style:none;
        }

        /* =========================
           앱 전체
        ========================= */
        .app{
            position:relative;
            width:100%;
            min-height:100svh;
            padding-bottom:76px;
            overflow-x:hidden;
            background:#fff;
        }

        /* =========================
           상단 메뉴바
        ========================= */
        .top-header{
            position:sticky;
            top:0;
            left:0;
            z-index:50;

            width:100%;
            height:56px;

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 20px;
            background:#fff;
            border-bottom:1px solid #eee;
        }

        .hamburger-button{
            width:32px;
            height:32px;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        .hamburger-button img{
            width:24px;
            height:24px;
            object-fit:contain;
        }

.header-logo img{
    width:165px;
    height:auto;
    margin-left: auto;
}

        /* =========================
           메인 비주얼
        ========================= */
        .main-visual{
            width:100%;
            height:230px;
            overflow:hidden;
        }

        .main-visual img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* =========================
           공통 콘텐츠 영역
        ========================= */
        .content-section{
            padding:24px;
        }

        .section-title{
            margin-bottom:18px;

            font-size:20px;
            line-height:1.3;
            font-weight:700;
            color:#4f70bd;
        }

        /* =========================
           테마별 카테고리
        ========================= */
        .theme-grid{
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            row-gap:24px;
        }

        .theme-item{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;

            font-size:14px;
            color:#555;
        }

        .theme-item img{
            width:42px;
            height:42px;
            object-fit:contain;
        }

        /* =========================
           쿠폰 / 이벤트 / 혜택
        ========================= */
        .benefit-list{
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:12px;

            margin-top:26px;
        }

        .benefit-button{
            min-height:42px;

            display:flex;
            align-items:center;
            justify-content:center;
            gap:7px;

            border-radius:10px;
            background:#f1f4fb;

            font-size:14px;
            font-weight:600;
            color:#5271b9;
        }

        .benefit-button img{
            width:21px;
            height:21px;
            object-fit:contain;
        }

        /* =========================
           장소 랭킹
        ========================= */
        .ranking-section{
            padding-top:0;
        }

        .ranking-grid{
            display:grid;
            grid-template-columns:repeat(2, 1fr);
            gap:8px;
        }

        .ranking-image{
            height:205px;
            overflow:hidden;
        }

        .ranking-image img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .ranking-wide{
            grid-column:1 / 3;
            height:195px;
            margin-top:14px;
        }

        /* =========================
           장소 상세 카드
        ========================= */
        .place-card{
            padding:24px;
        }

        .place-title-row{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:16px;
        }

        .place-title{
            font-size:19px;
            font-weight:700;
        }

        .bookmark-button{
            width:28px;
            height:28px;
            flex-shrink:0;
        }

        .bookmark-button img{
            width:24px;
            height:24px;
            object-fit:contain;
        }

        .place-address{
            margin-top:26px;

            font-size:14px;
            line-height:1.5;
            color:#777;
        }

        .place-button-row{
            display:grid;
            grid-template-columns:1.3fr .9fr;
            gap:18px;

            margin-top:24px;
        }

        .place-button{
            height:50px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:8px;
            font-size:16px;
            font-weight:600;
        }

        .route-button{
            background:#5575bd;
            color:#fff;
        }

        .cancel-button{
            border:1px solid #5575bd;
            background:#fff;
            color:#111;
        }

        /* =========================
           하단 고정 메뉴
        ========================= */
        .bottom-nav{
            position:fixed;
            left:0;
            bottom:0;
            z-index:45;

            width:100%;
            height:76px;

            display:flex;
            align-items:center;
            justify-content:space-around;

            background:#fff;
            border-top:1px solid #e7e7e7;
        }

        .nav-item{
            width:20%;
            height:100%;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:4px;

            font-size:13px;
            font-weight:600;
            color:#111;
        }

        .nav-item img{
            width:24px;
            height:24px;
            object-fit:contain;
        }

        .nav-item.active{
            color:#5271bd;
        }

        /* =========================
           메뉴 배경 오버레이
        ========================= */
        .menu-overlay{
            position:fixed;
            inset:0;
            z-index:90;

            visibility:hidden;
            opacity:0;

            background:rgba(0,0,0,.56);
            transition:
                opacity .3s ease,
                visibility .3s ease;
        }

        .menu-overlay.active{
            visibility:visible;
            opacity:1;
        }

        /* =========================
           모바일 슬라이드 메뉴
        ========================= */
        .mobile-menu{
            position:fixed;
            top:0;
            left:0;
            z-index:100;

            width:81%;
            height:100svh;

            padding:36px 24px;
            overflow-y:auto;

            background:#fff;
            border-radius:0 20px 20px 0;

            transform:translateX(-100%);
            transition:transform .35s ease;
        }

        .mobile-menu.active{
            transform:translateX(0);
        }

        /* 사용자 영역 */
        .user-profile{
            display:flex;
            align-items:center;
            gap:16px;
        }

        .profile-image{
            width:72px;
            height:72px;
            flex-shrink:0;

            border-radius:50%;
            overflow:hidden;
            background:#eee;
        }

        .profile-image img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .user-name{
            font-size:17px;
            line-height:1.4;
            font-weight:500;
        }

        .user-name strong{
            color:#5271bd;
        }

        .user-description{
            margin-top:4px;

            font-size:12px;
            line-height:1.4;
            color:#999;
        }

        .login-button{
    width:100%;
    height:48px;
    margin-top:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;
    background:#5575bd;
    color:#fff;

    font-size:16px;
    font-weight:500;
    text-decoration:none;
}

        /* 메뉴 섹션 */
        .menu-section{
            margin-top:24px;
            padding-top:20px;
            border-top:1px solid #eee;
        }

        .menu-section-title{
            margin-bottom:16px;

            font-size:15px;
            font-weight:700;
        }

        /* 바로가기 */
        .quick-menu{
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:8px;
        }

        .quick-item{
            height:70px;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:7px;

            border:1px solid #e7e7e7;
            border-radius:8px;

            font-size:12px;
            color:#777;
        }

        .quick-item img{
            width:24px;
            height:24px;
            object-fit:contain;
        }

        /* 테마 찾기 */
        .menu-theme-list{
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:8px;
        }

        .menu-theme-item{
            height:70px;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:6px;

            border:1px solid #e7e7e7;
            border-radius:8px;

            font-size:12px;
            color:#777;
        }

        .menu-theme-item img{
            width:32px;
            height:32px;
            object-fit:contain;
        }

        /* 서비스 메뉴 */
        .service-list{
            display:flex;
            flex-direction:column;
            gap:4px;
        }

        .service-item{
            height:48px;

            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .service-left{
            display:flex;
            align-items:center;
            gap:14px;

            font-size:15px;
            color:#777;
        }

        .service-left img{
            width:24px;
            height:24px;
            object-fit:contain;
        }

        .service-arrow{
            width:18px;
            height:18px;
            object-fit:contain;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 상단 메뉴바 -->
    <header class="top-header">

        <button
            id="menuOpenButton"
            type="button"
            class="hamburger-button"
            aria-label="메뉴 열기"
            aria-controls="mobileMenu"
            aria-expanded="false"
        >
            <img
                src="./images/icons_menu.svg"
                alt="메뉴"
            >
        </button>

        <a href="./home.html" class="header-logo">
            <img
                src="./images/Logo 1.svg"
                alt="차박 앱 로고"
            >
        </a>

    </header>

    <main>

        <!-- 메인 비주얼 -->
        <section class="main-visual">
            <img
                src="./images/home.svg"
                alt="캠핑카를 운전하는 파란 곰 캐릭터"
            >
        </section>

        <!-- 테마별 카테고리 -->
        <section class="content-section">

            <h2 class="section-title">테마별 카테고리</h2>

            <ul class="theme-grid">

                <li>
                    <a href="./search.html?theme=flower" class="theme-item">
                        <img src="./images/home icon1.svg" alt="꽃놀이">
                        <span>꽃놀이</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=fire" class="theme-item">
                        <img src="./images/home icon2.svg" alt="불멍">
                        <span>불멍</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=city" class="theme-item">
                        <img src="./images/home icon3.svg" alt="도심">
                        <span>도심</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=star" class="theme-item">
                        <img src="./images/home icon4.svg" alt="별감상">
                        <span>별감상</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=pet" class="theme-item">
                        <img src="./images/home icon5.svg" alt="반려견">
                        <span>반려견</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=nature" class="theme-item">
                        <img src="./images/home icon6.svg" alt="오지">
                        <span>오지</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=bbq" class="theme-item">
                        <img src="./images/home icon7.svg" alt="바베큐">
                        <span>바베큐</span>
                    </a>
                </li>

                <li>
                    <a href="./search.html?theme=equipment" class="theme-item">
                        <img src="./images/home icon8.svg" alt="장비">
                        <span>장비</span>
                    </a>
                </li>

            </ul>

            <!-- 혜택 메뉴 -->
            <div class="benefit-list">

                <a href="./coupon.html" class="benefit-button">
                    <img src="./images/homeicons_cupon.svg" alt="">
                    <span>쿠폰</span>
                </a>

                <a href="./event.html" class="benefit-button">
                    <img src="./images/homeicons_event.svg" alt="">
                    <span>이벤트</span>
                </a>

                <a href="./benefit.html" class="benefit-button">
                    <img src="./images/homeicons_benefit.svg" alt="">
                    <span>혜택</span>
                </a>

            </div>

        </section>

        <!-- 장소 랭킹 -->
        <section class="content-section ranking-section">

            <h2 class="section-title">장소 랭킹 Top 10</h2>

            <div class="ranking-grid">

                <div class="ranking-image">
                    <img
                        src="./images/homepicture1.jpg"
                        alt="캠핑카 여행 장소"
                    >
                </div>

                <div class="ranking-image">
                    <img
                        src="./images/homepicture2.jpg"
                        alt="숲속 캠핑카"
                    >
                </div>

                <div class="ranking-image ranking-wide">
                    <img
                        src="./images/homepicture3.jpg"
                        alt="숲속 텐트와 해먹"
                    >
                </div>

            </div>

        </section>

        <!-- 장소 정보 -->
        <section class="place-card">

            <div class="place-title-row">

                <h2 class="place-title">테마별 카테고리</h2>

                <button
                    type="button"
                    class="bookmark-button"
                    aria-label="장소 저장"
                >
                    <img
                        src="./images/homeicons_banner.svg"
                        alt="저장"
                    >
                </button>

            </div>

            <p class="place-address">
                강원도 원주시 치악면 치악산 1번지
            </p>

            <div class="place-button-row">

                <a
                    href="./map.html"
                    class="place-button route-button"
                >
                    길찾기
                </a>

                <button
                    type="button"
                    class="place-button cancel-button"
                >
                    해제하기
                </button>

            </div>

        </section>

    </main>

    <!-- 하단 메뉴 -->
    <nav class="bottom-nav">

        <a href="./home.html" class="nav-item active">
            <img src="./images/tabbaricon_home(blue).svg" alt="홈">
            <span>홈</span>
        </a>

        <a href="./search.html" class="nav-item">
            <img src="./images/tabbaricon_search.svg" alt="검색">
            <span>검색</span>
        </a>

        <a href="./group.html" class="nav-item">
            <img src="./images/tabbaricon_people.svg" alt="모임">
            <span>모임</span>
        </a>

        <a href="./live.html" class="nav-item">
            <img src="./images/tabbaricon_live.svg" alt="라이브">
            <span>LIVE</span>
        </a>

        <a href="./my.html" class="nav-item">
            <img src="./images/tabbaricon_my.svg" alt="마이페이지">
            <span>MY</span>
        </a>

    </nav>

</div>

<!-- 메뉴 오버레이 -->
<div id="menuOverlay" class="menu-overlay"></div>

<!-- 모바일 메뉴 -->
<aside
    id="mobileMenu"
    class="mobile-menu"
    aria-hidden="true"
>

    <!-- 프로필 -->
    <div class="user-profile">

        <div class="profile-image">
            <img
                src="./images/profile.png"
                alt="차박러 프로필"
            >
        </div>

        <div>
            <p class="user-name">
                안녕하세요,
                <strong>차박러님</strong>
            </p>

            <p class="user-description">
                나만의 차박 여행을 시작해보세요
            </p>
        </div>

    </div>

    <a href="./login.html" class="login-button">
        로그인 / 회원가입
    </a>

    <!-- 바로가기 -->
    <section class="menu-section">

        <h2 class="menu-section-title">바로가기</h2>

        <div class="quick-menu">

            <a href="./home.html" class="quick-item">
                <img src="./images/material-symbols_home-outline.svg" alt="홈">
                <span>홈</span>
            </a>

            <a href="./search.html" class="quick-item">
                <img src="./images/tabler_search.svg" alt="검색">
                <span>검색</span>
            </a>

            <a href="./save.html" class="quick-item">
                <img src="./images/material-symbols_bookmark-outline.svg" alt="저장">
                <span>저장</span>
            </a>

            <a href="./my.html" class="quick-item">
                <img src="./images/boxicons_user.svg" alt="마이페이지">
                <span>MY</span>
            </a>

        </div>

    </section>

    <!-- 테마로 찾기 -->
    <section class="menu-section">

        <h2 class="menu-section-title">테마로 찾기</h2>

        <div class="menu-theme-list">

            <a href="./search.html?theme=carcamp" class="menu-theme-item">
                <img src="./images/car.svg" alt="차박">
                <span>차박</span>
            </a>

            <a href="./search.html?theme=nature" class="menu-theme-item">
                <img src="./images/camp.svg" alt="오지">
                <span>오지</span>
            </a>

            <a href="./search.html?theme=bbq" class="menu-theme-item">
                <img src="./images/bbq.svg" alt="바베큐">
                <span>바베큐</span>
            </a>

            <a href="./search.html?theme=pet" class="menu-theme-item">
                <img src="./images/dog.svg" alt="반려견">
                <span>반려견</span>
            </a>

        </div>

    </section>

    <!-- 서비스 -->
    <section class="menu-section">

        <h2 class="menu-section-title">서비스</h2>

        <ul class="service-list">

            <li>
                <a href="./notice.html" class="service-item">

                    <span class="service-left">
                        <img src="./images/heroicons-outline_speakerphone.svg" alt="">
                        <span>공지사항</span>
                    </span>

                    <img
                        src="./images/material-symbols_navigate-next.svg"
                        alt="이동"
                        class="service-arrow"
                    >

                </a>
            </li>

            <li>
                <a href="./customer.html" class="service-item">

                    <span class="service-left">
                        <img src="./images/lucide_headset.svg" alt="고객센터">
                        <span>고객센터</span>
                    </span>

                    <img
                        src="./images/material-symbols_navigate-next.svg"
                        alt="이동"
                        class="service-arrow"
                    >

                </a>
            </li>

            <li>
                <a href="./setting.html" class="service-item">

                    <span class="service-left">
                        <img src="./images/uil_setting.svg" alt="설정">
                        <span>설정</span>
                    </span>

                    <img
                        src="./images/material-symbols_navigate-next.svg"
                        alt="이동"
                        class="service-arrow"
                    >

                </a>
            </li>

        </ul>

    </section>

</aside>

<script>
    const menuOpenButton =
        document.getElementById("menuOpenButton");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const menuOverlay =
        document.getElementById("menuOverlay");

    function openMenu() {
        mobileMenu.classList.add("active");
        menuOverlay.classList.add("active");

        document.body.classList.add("menu-open");

        menuOpenButton.setAttribute(
            "aria-expanded",
            "true"
        );

        mobileMenu.setAttribute(
            "aria-hidden",
            "false"
        );
    }

    function closeMenu() {
        mobileMenu.classList.remove("active");
        menuOverlay.classList.remove("active");

        document.body.classList.remove("menu-open");

        menuOpenButton.setAttribute(
            "aria-expanded",
            "false"
        );

        mobileMenu.setAttribute(
            "aria-hidden",
            "true"
        );
    }

    menuOpenButton.addEventListener(
        "click",
        openMenu
    );

    menuOverlay.addEventListener(
        "click",
        closeMenu
    );

    document.addEventListener(
        "keydown",
        function(event) {
            if (
                event.key === "Escape" &&
                mobileMenu.classList.contains("active")
            ) {
                closeMenu();
            }
        }
    );

    const mobileMenuLinks =
        mobileMenu.querySelectorAll("a");

    mobileMenuLinks.forEach(function(link) {
        link.addEventListener("click", closeMenu);
    });
</script>

</body>
</html>
