<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>차박 어디로 - 온보딩</title>

    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }
        a{text-decoration:none;}
        a:hover{
    color:#fff;
    text-decoration:none;
}

        button {
            border: 0;
            background: none;
            font-family: inherit;
        }

        /* 모바일 앱 전체 영역 */
        .app {
            position: relative;

            width: 100%;
            height: 812px;
            min-height: 812px;

            background-color: #ffffff;
            overflow: hidden;
        }
        /* =========================
           온보딩 내용
        ========================= */
        .onboarding {
            position: relative;

            width: 100%;
            height: 100%;
        }

        /* 텍스트 영역 */
        .text-area {
            position: absolute;
            top: 102px;
            left: 24px;
            z-index: 3;

            width: calc(100% - 48px);
        }

        .title {
            color: #354c82;
            font-size: 29px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -1.8px;
        }

        .title-small {
            color: #6d86c0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1.2px;
        }

        .description {
            margin-top: 23px;

            color: #91a7d8;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.7px;
        }

        /* 캐릭터 이미지 영역 */
        .visual-area {
            position: absolute;
            top: 341px;
            left: 0;

            width: 100%;
            height: 301px;

            overflow: hidden;
        }

        /* 오른쪽 연한 배경 도형 */
        .visual-area::before {
            content: "";

            position: absolute;
            top: 24px;
            left: 81px;

            width: 370px;
            height: 276px;

            background-color: #f1f4fb;
            border-radius: 48% 0 0 48%;

            transform: rotate(-14deg);
            transform-origin: center;
        }

        /* 캐릭터 일러스트 */
        .character-image {
            position: absolute;
            top: 3px;
            left: 61px;
            z-index: 2;

            display: block;

            width: 287px;
            height: auto;

            object-fit: contain;
        }

        /* =========================
           페이지 표시 점
        ========================= */
        .pagination {
            position: absolute;
            bottom: 134px;
            left: 0;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;

            width: 100%;
        }

        .pagination-dot {
            display: block;

            width: 10px;
            height: 10px;

            background-color: #edf0f8;
            border-radius: 50%;
        }

        .pagination-dot.active {
            background-color: #5876bd;
        }

        /* =========================
           시작하기 버튼
        ========================= */
        .start-button {
            position: absolute;
            bottom: 34px;
            left: 24px;
            z-index: 5;

            width: calc(100% - 48px);
            height: 49px;

            color: #ffffff;
            background-color: #5574ba;

            border-radius: 12px;

            font-size: 15px;
            font-weight: 700;
            line-height: 49px;
            text-align: center;

            cursor: pointer;
        }

        .start-button:active {
            background-color: #4967ac;
        }
    </style>
</head>

<body>
    <div class="app">
        </header>

        <!-- 온보딩 화면 -->
        <main class="onboarding">

            <!-- 제목 및 설명 -->
            <section class="text-area">
                <h1 class="title">
                    차박<br>
                    어디로
                    <span class="title-small">떠나야 할지 모르겠나요</span>
                </h1>

                <p class="description">
                    지도기반 위치 앱 및 키워드 검색으로 내가 원<br>
                    하는 장소를 한번에
                </p>
            </section>

            <!-- 캐릭터 이미지 -->
            <section class="visual-area">
                <img
                    src="./images/work1.svg"
                    alt="휴대폰으로 차박 장소를 검색하는 곰 캐릭터"
                    class="character-image"
                >
            </section>

            <!-- 온보딩 페이지 표시 -->
            <div class="pagination" aria-label="온보딩 1번째 화면">
                <span class="pagination-dot active"></span>
                <span class="pagination-dot"></span>
                <span class="pagination-dot"></span>
            </div>

            <!-- 시작하기 버튼 -->
            <a href="./login.html">
                <button type="button" class="start-button">
                시작하기
            </button>
            </a>

        </main>

    </div>
</body>
</html>
