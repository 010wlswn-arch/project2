<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>차박 어디로 - 온보딩 2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: inherit;
            text-decoration: none;
        }

        .app {
            position: relative;
            width: 100%;
            height: 812px;
            min-height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .onboarding {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 상단 텍스트 */
        .text-area {
            position: absolute;
            top: 101px;
            left: 24px;
            z-index: 3;
            width: calc(100% - 48px);
        }

        .title {
            color: #354b7e;
            font-size: 29px;
            font-weight: 700;
            line-height: 1.22;
            letter-spacing: -1.8px;
        }

        .title-light {
            color: #7189c3;
        }

        .description {
            margin-top: 25px;
            color: #91a7d8;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.7px;
        }

        /* 중앙 이미지 영역 */
        .visual-area {
            position: absolute;
            top: 328px;
            left: 0;
            width: 100%;
            height: 310px;
            overflow: hidden;
        }

        /* 연한 파란 배경 도형 */
        .visual-area::before {
            content: "";
            position: absolute;
            top: 8px;
            left: -54px;
            width: 500px;
            height: 247px;
            background-color: #f0f3fa;
            border-radius: 50%;
            transform: rotate(4deg);
        }

        /* 캐릭터 이미지 */
        .character-image {
            position: absolute;
            top: 34px;
            left: 75px;
            z-index: 2;
            display: block;
            width: 241px;
            height: auto;
            object-fit: contain;
        }

        /* 페이지 표시 점 */
        .pagination {
            position: absolute;
            bottom: 134px;
            left: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .pagination-dot {
            display: block;
            width: 10px;
            height: 10px;
            background-color: #edf0f8;
            border-radius: 50%;
        }

        .pagination-dot.active {
            background-color: #5876bd;
        }

        /* 시작하기 버튼 */
        .start-button {
            position: absolute;
            bottom: 34px;
            left: 24px;
            z-index: 5;

            display: flex;
            align-items: center;
            justify-content: center;

            width: calc(100% - 48px);
            height: 49px;

            color: #ffffff;
            background-color: #5574ba;
            border-radius: 12px;

            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .start-button:hover {
            color: #ffffff;
            background-color: #4967ac;
        }
    </style>
</head>

<body>
    <div class="app">
        <main class="onboarding">

            <!-- 제목과 설명 -->
            <section class="text-area">
                <h1 class="title">
                    <span class="title-light">차박</span><br>
                    <span class="title-light">어디로</span>
                    떠나야 할지 모르겠나<br>
                    요
                </h1>

                <p class="description">
                    차박에 필요한 물품들을 용도별로 둘러봐요
                </p>
            </section>

            <!-- 캐릭터 이미지 -->
            <section class="visual-area">
                <img
                    src="./images/work2.svg"
                    alt="차박용품 상자를 들고 있는 곰 캐릭터"
                    class="character-image"
                >
            </section>

            <!-- 페이지 표시 -->
            <div class="pagination" aria-label="온보딩 두 번째 화면">
                <span class="pagination-dot"></span>
                <span class="pagination-dot active"></span>
                <span class="pagination-dot"></span>
            </div>

            <!-- 세 번째 온보딩 화면으로 이동 -->
            <a href="./onboarding3.html" class="start-button">
                시작하기
            </a>

        </main>
    </div>
</body>
</html>
