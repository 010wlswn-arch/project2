<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>차박 어디로 - 온보딩 3</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;
        }
        a{text-decoration:none;}
        a:hover{
    color:#fff;
    text-decoration:none;
}
        button {
            border: 0;
            background: none;
            font-family: inherit;
        }

        .app {
            position: relative;
            width: 100%;
            height: 812px;
            min-height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .onboarding {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .text-area {
            position: absolute;
            top: 99px;
            left: 24px;
            z-index: 3;
            width: calc(100% - 48px);
        }

        .title {
            color: #344b80;
            font-size: 29px;
            font-weight: 700;
            line-height: 1.28;
            letter-spacing: -1.8px;
        }

        .title-top {
            display: block;
            margin-bottom: 2px;
            color: #7189c3;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1.2px;
        }

        .title-sub {
            color: #7189c3;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -1.2px;
        }

        .description {
            margin-top: 25px;
            color: #91a7d8;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.7px;
        }

        .visual-area {
            position: absolute;
            top: 360px;
            left: 0;
            width: 100%;
            height: 285px;
            overflow: hidden;
        }

        .visual-area::before {
            content: "";
            position: absolute;
            top: 31px;
            left: -85px;
            width: 395px;
            height: 205px;
            background-color: #f0f3fa;
            border-radius: 0 60% 60% 0;
            transform: rotate(9deg);
            transform-origin: center;
        }

        .character-image {
            position: absolute;
            top: 0;
            left: 68px;
            z-index: 2;
            display: block;
            width: 258px;
            height: auto;
            object-fit: contain;
        }

        .pagination {
            position: absolute;
            bottom: 134px;
            left: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
        }

        .pagination-dot {
            display: block;
            width: 10px;
            height: 10px;
            background-color: #edf0f8;
            border-radius: 50%;
        }

        .pagination-dot.active {
            background-color: #5876bd;
        }

        .start-button {
            position: absolute;
            bottom: 34px;
            left: 24px;
            z-index: 5;
            width: calc(100% - 48px);
            height: 49px;
            color: #ffffff;
            background-color: #5574ba;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            line-height: 49px;
            text-align: center;
            cursor: pointer;
        }

        .start-button:active {
            background-color: #4967ac;
        }
    </style>
</head>

<body>
    <div class="app">
        <main class="onboarding">

            <section class="text-area">
                <h1 class="title">
                    <span class="title-top">일상이 바쁠땐 실시간</span>
                    라이브로 대리만족
                    <span class="title-sub">하세요</span>
                </h1>

                <p class="description">
                    라이브로 나를 뽐내고 시청자들과 소통하는<br>
                    즐거움!
                </p>
            </section>

            <section class="visual-area">
                <img
                    src="./images/work3.svg"
                    alt="모닥불 앞에서 라이브 방송을 하는 곰 캐릭터"
                    class="character-image"
                >
            </section>

            <div class="pagination" aria-label="온보딩 세 번째 화면">
                <span class="pagination-dot"></span>
                <span class="pagination-dot"></span>
                <span class="pagination-dot active"></span>
            </div>

            <a href="./login.html">
                <button type="button" class="start-button">
                시작하기
            </button>
            </a>

        </main>
    </div>
</body>
</html>
