<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Camba Splash</title>

    <style>
        /* 전체 요소 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* 모바일 앱 전체 화면 */
        .app {
            position: relative;
             width: 100%;
             height: 100vh;
             height: 100dvh;
             overflow: hidden;
            background-color: #ffffff;
            overflow: hidden;
        }


        /* 중앙 로고 영역 */
        .splash-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 중앙 로고 */
        .splash-logo {
            display: block;
            width: 148px;
            height: auto;
            margin-top: -2px;
            object-fit: contain;
        }

    </style>
</head>

<body>
    <div class="app">
        </header>

        <!-- 중앙 로고 -->
        <main class="splash-content">
            <img
                src="./images/logo.svg"
                alt="camba"
                class="splash-logo"
            >
        </main>
        </footer>

    </div>
<script>
        setTimeout(function () {
            window.location.href = "./onboard1.html";
        }, 3000);
    </script>
</body>
</html>
