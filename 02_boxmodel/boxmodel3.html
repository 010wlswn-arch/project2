<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델3</title>
    <style>
        *{margin: 0; padding: 0;}
       .box{
            /*박스 가로 사이즈*/
            width: 1000px;
            /*박스 세로 사이즈*/
            height: 300px;
            /*테두리선 두께 5 실선 선색검정색*/
            border: 5px solid #000;
            /*박스 통째로 가운데 정렬*/
            margin: 0 auto;
            display: flex;
            gap: 20px;

        }
        .box div{
            /*박스 가로 사이즈*/
            width: 320px;
            /*박스 세로 사이즈*/
            height: 300px;
            
            background-color: #ff0;
        }
        /*순서 없는 목록을 이용하여 디자인*/
        ul{
        /*박스 가로 사이즈*/    
        width: 1000px;
         /*박스 세로 사이즈*/
        height: 300px;
        /*테두리선 두께 5 실선 선색검정색*/
        border: 5px solid #000;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        }
        ul li{
            list-style: none;
            width: 320px;
            height: 300px;
            background-color: #ff0;
    }

    </style>
</head>
<body>
    <div class="box">
        <div>박스1</div>
        <div>박스2</div>
        <div>박스3</div>
    </div>

    <script> 

    </script>
</body>
</html>
<ul>
    <li>박스1</li>
    <li>박스2</li>
    <li>박스3</li>
</ul>
