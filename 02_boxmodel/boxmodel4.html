<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델응용</title>
<style>
        *{margin: 0; padding: 0;}
       .box{
            /*박스 가로 사이즈*/
            width: 1000px;
            /*박스 세로 사이즈*/
            height: 300px;
            /*테두리선 두께 5 실선 선색검정색*/
            border: 5px solid #000;
            /*박스 통째로 가운데 정렬*/
            margin: 0 auto;
            display: flex;
            gap: 20px;

        }
        .box div{
            /*박스 가로 사이즈*/
            width: 240px;
            /*박스 세로 사이즈*/
            height: 300px;
            background-color: #f0f8ff;
        }
        /*순서 없는 목록을 이용하여 디자인*/
        ul{
        /*박스 가로 사이즈*/    
        width: 1000px;
         /*박스 세로 사이즈*/
        height: 300px;
        /*테두리선 두께 5 실선 선색검정색*/
        border: 5px solid #000;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        }
        ul li{
            list-style: none;
            width: 240px;
            height: 300px;
            background-color: #ffc0cb;
    }

    </style>
</head>
<body>
    <!--div 태그를 사용해서 boxmodel 구현-->
    <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <script> 

    </script>
</body>
</html>
<!-- div 태그를 사용해서 boxmodel구현-->
<ul>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
</ul>
