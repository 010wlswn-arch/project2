    <title>박스만들기</title>
    <style>
            *{margin: 0; padding: 0;}
        .parent{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        .parent div{
            width: 240px;
            height: 300px;
            background-color: #f0f8ff;
        }
        ul{
            width: 1000px;
            height: 300px;
            border: 5px solid #000;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        ul li{
            list-style: none;
            width: 240px;
            height: 300px;
            background-color: #ffc0cb;

        }
    </style>
</head>
<body>
