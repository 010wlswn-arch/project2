<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열과 객체 반복문</title>
</head>
<body>
    <script>
        // 책 객체를 배열에 저장
        const books = [
            {
                "책 제목": "미드나잇 라이브러리",
                "저자": "매트 헤이그",
                "가격": "14,220원",
                "출간일": "2021-04-28",
                "페이지 수": 408,
                "ISBN": "9791191056556(1191056554)"
            },
            {
                "책 제목": "미드나잇 라이브러리",
                "저자": "매트 헤이그",
                "가격": "14,220원",
                "출간일": "2021-04-28",
                "페이지 수": 408,
                "ISBN": "9791191056556(1191056554)"
            },
            {
                "책 제목": "미드나잇 라이브러리",
                "저자": "매트 헤이그",
                "가격": "14,220원",
                "출간일": "2021-04-28",
                "페이지 수": 408,
                "ISBN": "9791191056556(1191056554)"
            },
            {
                "책 제목": "미드나잇 라이브러리",
                "저자": "매트 헤이그",
                "가격": "14,220원",
                "출간일": "2021-04-28",
                "페이지 수": 408,
                "ISBN": "9791191056556(1191056554)"
            }
        ];

        // 배열 반복문
        for (let i = 0; i < books.length; i++) {

            // 객체 반복문
            for (let key in books[i]) {
                document.write(`${key} : ${books[i][key]}<br>`);
            }

            // 책 정보마다 구분선 출력
            document.write("<hr>");
        }
    </script>
</body>
</html>
