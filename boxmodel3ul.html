<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델</title>

    <style>
        /* 기본 여백 초기화 */
        *{
            margin:0;
            padding:0;
        }

        /* 부모 박스 */
        ul{
            width:1000px;
            height:300px;
            border:5px solid #000;
            margin:0 auto;
            list-style:none;

            display:flex;
            justify-content:space-between;
        }

        /* 자식 박스 */
        li{
            width:320px;
            height:300px;
            background:yellow;
        }
    </style>

</head>
<body>

    <ul>
        <li>박스1</li>
        <li>박스2</li>
        <li>박스3</li>
    </ul>

</body>
</html>
