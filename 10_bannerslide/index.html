<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>설화수 추천</title>

    <!-- Swiper CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >

    <!-- 사용자 CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


    <!-- ========================================
         설화수 추천 슬라이드 Section
    ========================================= -->
    <section class="recommend-section">

        <div class="recommend-inner">

            <!-- 섹션 제목 -->
            <h2 class="recommend-title">
                설화수 추천
            </h2>


            <!-- ========================================
                 상품 슬라이드 영역
            ========================================= -->
            <div class="recommend-slider-wrap">

                <div class="swiper recommend-swiper">

                    <div class="swiper-wrapper">


                        <!-- =========================
                             Slide 01
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <!-- 상품 이미지 -->
                                <div class="product-image">

                                    <img
                                        src="./images/1.jpg"
                                        alt="탄력크림 EX"
                                    >

                                </div>

                                <!-- 상품 정보 -->
                                <div class="product-info">

                                    <h3>
                                        탄력크림 EX
                                    </h3>

                                    <p class="product-eng">
                                        Essential Firming Cream EX
                                    </p>

                                    <p class="product-price">
                                        100,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- =========================
                             Slide 02
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <div class="product-image">

                                    <img
                                        src="./images/2.jpg"
                                        alt="자정미백크림"
                                    >

                                </div>

                                <div class="product-info">

                                    <h3>
                                        자정미백크림
                                    </h3>

                                    <p class="product-eng">
                                        Lumise Discoloration Corrector
                                    </p>

                                    <p class="product-price">
                                        150,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- =========================
                             Slide 03
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <div class="product-image">

                                    <img
                                        src="./images/3.jpg"
                                        alt="퍼펙팅 쿠션 에어리"
                                    >

                                </div>

                                <div class="product-info">

                                    <h3>
                                        퍼펙팅 쿠션 에어리
                                    </h3>

                                    <p class="product-eng">
                                        Perfecting Cushion Airy
                                    </p>

                                    <p class="product-price">
                                        89,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- =========================
                             Slide 04
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <div class="product-image">

                                    <img
                                        src="./images/4.jpg"
                                        alt="윤조에센스"
                                    >

                                </div>

                                <div class="product-info">

                                    <h3>
                                        윤조에센스
                                    </h3>

                                    <p class="product-eng">
                                        First Care Activating Serum
                                    </p>

                                    <p class="product-price">
                                        140,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- =========================
                             Slide 05
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <div class="product-image">

                                    <img
                                        src="./images/5.jpg"
                                        alt="진설크림"
                                    >

                                </div>

                                <div class="product-info">

                                    <h3>
                                        진설크림
                                    </h3>

                                    <p class="product-eng">
                                        Timetreasure Invigorating Cream
                                    </p>

                                    <p class="product-price">
                                        470,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- =========================
                             Slide 06
                        ========================== -->
                        <div class="swiper-slide">

                            <div class="product-card">

                                <div class="product-image">

                                    <img
                                        src="./images/6.jpg"
                                        alt="상백선크림"
                                    >

                                </div>

                                <div class="product-info">

                                    <h3>
                                        상백선크림
                                    </h3>

                                    <p class="product-eng">
                                        UV Wise Brightening Multi Protector
                                    </p>

                                    <p class="product-price">
                                        90,000원
                                    </p>

                                </div>

                            </div>

                        </div>


                    </div>

                </div>


                <!-- ========================================
                     이전 버튼
                     이미지는 원하는 파일로 교체
                ========================================= -->
                <button
                    type="button"
                    class="slide-button slide-prev"
                    aria-label="이전 상품"
                >

                    <img
                        src="./images/20210324-main-kv-arr-l.png"
                        alt="이전버튼"
                    >

                </button>


                <!-- ========================================
                     다음 버튼
                     이미지는 원하는 파일로 교체
                ========================================= -->
                <button
                    type="button"
                    class="slide-button slide-next"
                    aria-label="다음 상품"
                >

                    <img
                        src="./images/20210324-main-kv-arr-r.png"
                        alt="다음버튼"
                    >

                </button>

            </div>


            <!-- ========================================
                 진행상태 / 재생 컨트롤
            ========================================= -->
            <div class="slide-control">

                <!-- 진행 막대 -->
                <div class="progress-wrap">

                    <div class="progress-bar">
                        <span class="progress-fill"></span>
                    </div>

                </div>


                <!-- 일시정지 / 재생 -->
                <button
                    type="button"
                    class="play-control"
                    aria-label="슬라이드 일시정지"
                >

                    <!-- 일시정지 이미지 -->
                    <img
                        class="pause-icon"
                        src="./images/다운로드.svg"
                        alt="일시정지"
                    >

                    <!-- 재생 이미지 -->
                    <img
                        class="play-icon"
                        src="./images/다운로드 (1).svg"
                        alt="재생"
                    >

                </button>

            </div>


        </div>

    </section>


    <!-- Swiper JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 사용자 JavaScript -->
    <script src="./js/main.js"></script>

</body>
</html>
