<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일아산병원</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="header">
        <button><img src="./images/bg_header_lnb.png" alt="햄버거버튼"></button>
        <h1>
            <a href="index.html"><img src="./images/img_header_logo.png" alt="아산병원로고"></a>
        </h1>
        <button><img src="./images/img_topSerch.png" alt="검색버튼"></button>
    </div>
    <!-- Slider main container -->
<div class="swiper">
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide"><img src="./images/main_visual_640.png" alt="메인배너이미지1"></div>
    <div class="swiper-slide"><img src="./images/main_visual_newsweek.png" alt="메인배너이미지2"></div>
    <div class="swiper-slide"><img src="./images/main_visua3.jpg" alt="메인배너이미지3"></div>
  </div>
  <!-- If we need pagination -->
  <div class="swiper-pagination"></div>

  <!-- If we need navigation buttons -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>

  <!-- If we need scrollbar -->
  <!-- <div class="swiper-scrollbar"></div> -->
</div>
        <!--swiper슬라이드 자바스크립트-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <!--내가 만든 자바스크립트-->
    <script src="./js/main.js"></script>
</body>
</html>
