<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 영재 올림피아드</title>

<style>
    /* 여백 초기화 */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:"맑은 고딕", sans-serif;
    }

    /* 전체 박스 */
    .wrap{
        width:640px;
        border:3px solid red;
        margin:15px auto;
        padding:42px 20px 16px;
    }

    /* 메인 제목 */
    h1{
        background:#ffff00;
        text-align:center;
        font-size:28px;
        padding:18px 0;
        margin-bottom:24px;
    }

    /* 링크 */
    .link{
        color:blue;
        font-size:18px;
        margin-bottom:18px;
    }

    /* 안내문 */
    .notice{
        font-size:18px;
        font-weight:bold;
        margin-bottom:24px;
    }

    /* 회색 제목 */
    h2{
        background:#d3d3d3;
        text-align:center;
        font-size:24px;
        font-weight:normal;
        padding:10px 0;
        margin-bottom:24px;
    }

    ul{
        margin-left:40px;
        margin-bottom:36px;
    }

    li{
        font-size:18px;
    }

    p{
        font-size:16px;
        line-height:2;
        margin-bottom:26px;
    }

    /* 이벤트 버튼 */
    .btn{
        display:inline-block;
        background:purple;
        color:white;
        font-size:13px;
        text-decoration:none;
        padding:6px 10px;
        margin-right:4px;
    }
</style>

</head>
<body>

<div class="wrap">

    <h1>한국 영재 올림피아드</h1>

    <p class="link">
        한국 영재 올림피아드(Korea Olympiad for the Gifted Students)는...
    </p>

    <p class="notice">
        (↑ 클릭하면 자세한 설명으로 이동합니다.)
    </p>

    <h2>대회 개요</h2>

    <ul>
        <li>대회일시</li>
        <li>대회일시</li>
        <li>대회일시</li>
    </ul>

    <p>
        한국 영재 올림피아드에 참가하는 학생 여러분들을 진심으로 환영하며
        격려를 아끼지 않습니다.
    </p>

    <p>
        과학에 관심있고 재능있는 여러분들의 도전을 응원하겠습니다!!
    </p>

    <a href="#" class="btn">이벤트</a>
    <a href="#" class="btn">이벤트</a>
    <a href="#" class="btn">이벤트</a>

</div>

</body>
</html>
