<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Q-Link 접수 완료</title>

    <style>
        /* =========================
           기본 초기화
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family:
                "SUIT",
                "Pretendard",
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                sans-serif;
            background-color: #ffffff;
            color: #273343;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        img {
            display: block;
        }

        /* =========================
           모바일 앱 전체 화면
        ========================= */
        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 하단 탭바를 제외한 본문 */
        .app-content {
            width: 100%;
            height: calc(100svh - 70px);
            padding: 39px 16px 28px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .app-content::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           상단 공통 헤더
        ========================= */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand-link {
            display: block;
        }

        .brand-logo {
            width: 91px;
            height: auto;
            object-fit: contain;
        }

        .notification-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .notification-icon {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        /* =========================
           접수 완료 안내 영역
        ========================= */
        .completion-section {
            width: 100%;
            margin-top: 25px;
            text-align: center;
        }

        .check-icon {
            width: 66px;
            height: 66px;
            margin: 0 auto;
            object-fit: contain;
        }

        .completion-title {
            margin-top: 27px;
            color: #141c28;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: -1px;
        }

        /* =========================
           접수 정보 카드
        ========================= */
        .reception-card {
            width: 100%;
            margin-top: 23px;
            overflow: hidden;
            border: 1px solid #9eabba;
            border-radius: 8px;
            background-color: #ffffff;
        }

        .reception-information {
            padding: 23px 20px 22px;
            text-align: center;
        }

        .hospital-name {
            color: #273241;
            font-size: 23px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: -0.8px;
        }

        .reception-number {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 21px;
            color: #34404f;
            font-size: 16px;
            line-height: 1.4;
        }

        .reception-number-label {
            font-weight: 600;
        }

        .reception-number-value {
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .completion-time-area {
            padding: 22px 20px 25px;
            border-top: 1px solid #d2d7de;
            text-align: center;
        }

        .completion-time-label {
            color: #34404f;
            font-size: 16px;
            font-weight: 600;
        }

        .completion-time {
            margin-top: 8px;
            color: #121a27;
            font-size: 42px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
        }

        /* =========================
           안내 문구
        ========================= */
        .notification-guide {
            margin-top: 15px;
            color: #273241;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* =========================
           버튼 영역
        ========================= */
        .button-group {
            width: 100%;
            margin-top: 28px;
        }

        .main-button,
        .home-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 49px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .main-button {
            background-color: #5594f7;
            color: #ffffff;
        }

        .home-button {
            margin-top: 24px;
            border: 1px solid #d1d5dc;
            background-color: #f0f1f3;
            color: #4d5867;
        }

        /* =========================
           하단 공통 탭바
        ========================= */
        .bottom-tabbar {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            display: flex;
            width: 100%;
            height: 70px;
            border-top: 1px solid #e5e8ed;
            background-color: #ffffff;
            box-shadow: 0 -2px 8px rgba(25, 42, 70, 0.03);
        }

        .tab-item {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            color: #4d5866;
        }

        .tab-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .tab-name {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.4px;
        }

        /* 현재 접수 내역 탭 */
        .tab-item.active {
            color: #4f8ef7;
        }

        /* 눌림 효과 */
        .brand-link:active,
        .notification-button:active,
        .main-button:active,
        .home-button:active,
        .tab-item:active {
            opacity: 0.65;
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- 본문 -->
        <div class="app-content">

            <!-- 상단 공통 헤더 -->
            <header class="top-header">

                <!-- Q-Link 로고 클릭 시 홈 화면으로 이동 -->
                <a
                    href="./home.html"
                    class="brand-link"
                    aria-label="Q-Link 홈 화면으로 이동"
                >
                    <img
                        src="./images/homeLogo.svg"
                        alt="Q-Link 로고"
                        class="brand-logo"
                    >
                </a>

                <!-- 알림 화면 이동 -->
                <a
                    href="./알림화면"
                    class="notification-button"
                    aria-label="알림 화면으로 이동"
                >
                    <img
                        src="./icons/homebell.svg"
                        alt="알림종 모양 아이콘"
                        class="notification-icon"
                    >
                </a>

            </header>

            <!-- 접수 완료 안내 -->
            <section class="completion-section">

                <!-- 체크 완료 아이콘 파일명 수정 -->
                <img
                    src="./icons/listicons_check.svg"
                    alt="접수 완료 체크 아이콘"
                    class="check-icon"
                >

                <h1 class="completion-title">
                    접수가 완료되었습니다!
                </h1>

            </section>

            <!-- 접수 정보 -->
            <section class="reception-card">

                <div class="reception-information">

                    <h2 class="hospital-name">
                        강남연세내과의원
                    </h2>

                    <p class="reception-number">

                        <span class="reception-number-label">
                            접수번호
                        </span>

                        <strong class="reception-number-value">
                            2026-0706-0012
                        </strong>

                    </p>

                </div>

                <div class="completion-time-area">

                    <p class="completion-time-label">
                        예상 완료 시간
                    </p>

                    <p class="completion-time">
                        10:30
                    </p>

                </div>

            </section>

            <!-- 알림 안내 -->
            <p class="notification-guide">
                내 순서가 되면 알림을 보내드릴게요.
            </p>

            <!-- 이동 버튼 -->
            <div class="button-group">

                <!-- 대기 현황 화면 이동 -->
                <a
                    href="./wait.html"
                    class="main-button"
                >
                    내 대기 현황 보기
                </a>

                <!-- 홈 화면 이동 -->
                <a
                    href="./home.html"
                    class="home-button"
                >
                    홈으로 가기
                </a>

            </div>

        </div>

        <!-- 하단 공통 탭바 -->
        <nav
            class="bottom-tabbar"
            aria-label="하단 메뉴"
        >

            <!-- 홈 -->
            <a
                href="./home.html"
                class="tab-item"
            >
                <img
                    src="./icons/tabbaricons_home.svg"
                    alt="홈 화면 아이콘"
                    class="tab-icon"
                >
                <span class="tab-name">홈</span>
            </a>

            <!-- 검색 -->
            <a
                href="./search.html"
                class="tab-item"
            >
                <img
                    src="./icons/tabbaricons_search.svg"
                    alt="검색 화면 아이콘"
                    class="tab-icon"
                >
                <span class="tab-name">검색</span>
            </a>

            <!-- 대기현황 -->
            <a
                href="./wait.html"
                class="tab-item"
            >
                <img
                    src="./icons/tabbaricons_wait.svg"
                    alt="대기현황 화면 아이콘"
                    class="tab-icon"
                >
                <span class="tab-name">대기현황</span>
            </a>

            <!-- 접수 내역: 현재 활성화 -->
            <a
                href="./list.html"
                class="tab-item active"
            >
                <img
                    src="./icons/tabbaricons_list(blue).svg"
                    alt="접수 내역 화면 아이콘"
                    class="tab-icon"
                >
                <span class="tab-name">접수 내역</span>
            </a>

            <!-- 마이페이지 -->
            <a
                href="./mypage.html"
                class="tab-item"
            >
                <img
                    src="./icons/tabbaricons_my.svg"
                    alt="마이페이지 화면 아이콘"
                    class="tab-icon"
                >
                <span class="tab-name">마이페이지</span>
            </a>

        </nav>

    </main>

</body>
</html>
