<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Q-Link 로그인</title>

    <style>
        /* 기본 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                "SUIT",
                "Pretendard",
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                sans-serif;
            background-color: #ffffff;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        a {
            color: inherit;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 로그인 전체 화면 */
        .login-page {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 전체 콘텐츠 영역 */
 .login-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100svh;
    padding: 40px 36px 24px;
}
        /* 로고 영역 */
        .logo-area {
            text-align: center;
        }

        /* 사용자가 삽입하는 로고 이미지 */
        .logo-image {
            display: block;
            width: 112px;
            height: auto;
            margin: 0 auto;
            object-fit: contain;
        }

        /* 로고 아래 문구 */
        .login-description {
            margin-top: 31px;
            color: #5d6978;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: -0.8px;
            text-align: center;
        }

        /* 로그인 폼 */
        .login-form {
            margin-top: 31px;
        }

        /* 입력창 그룹 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 입력창 */
        .login-input {
            display: block;
            width: 100%;
            height: 49px;
            padding: 0 13px;
            border: 1px solid #aeb9c8;
            border-radius: 9px;
            outline: none;
            background-color: #ffffff;
            color: #283444;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: -0.4px;
            caret-color: #4f8ef7;
        }

        /* 안내 문구 */
        .login-input::placeholder {
            color: #a5afbc;
            opacity: 1;
        }

        /* 입력창 클릭 상태 */
        .login-input:focus {
            border-color: #4f8ef7;
            box-shadow: 0 0 0 2px rgba(79, 142, 247, 0.12);
        }

        /* 로그인 버튼 */
        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 49px;
            margin-top: 16px;
            border-radius: 8px;
            background-color: #5594f7;
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .login-button:active {
            opacity: 0.75;
        }

        /* 간편 로그인 영역 */
        .easy-login {
            margin-top: 48px;
            text-align: center;
        }

        .easy-login-title {
            color: #354151;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.7px;
        }

        /* 간편 로그인 아이콘 영역 */
        .social-login-list {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 25px;
        }

        /* 간편 로그인 공통 버튼 */
        .social-login-button {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 49px;
            height: 49px;
            border-radius: 50%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .social-login-button:active {
            opacity: 0.7;
        }

       .social-login-button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 49px;
    height: 49px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

        /* 하단 회원 메뉴 */
        .account-menu {
    margin-top: 36px;
    padding-bottom: 32px;
    text-align: center;
}

        .account-link {
            display: block;
            width: fit-content;
            min-height: 44px;
            margin: 0 auto;
            color: #354151;
            font-size: 19px;
            font-weight: 500;
            line-height: 44px;
            letter-spacing: -0.7px;
        }

        .find-link {
            margin-top: -1px;
        }

        /* 키보드 포커스 */
        .login-button:focus-visible,
        .social-login-button:focus-visible,
        .account-link:focus-visible {
            outline: 2px solid #4f8ef7;
            outline-offset: 4px;
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- 로고 -->
            <header class="logo-area">

                <img
                    src="./images/loginLogo.svg"
                    alt="Q-Link 로고"
                    class="logo-image"
                >

                <p class="login-description">
                    로그인하여 더 편리하게<br>
                    이용하세요.
                </p>

            </header>

            <!-- 로그인 입력 영역 -->
            <form
                class="login-form"
                id="loginForm"
                autocomplete="on"
            >

                <div class="input-group">

                    <label for="phoneNumber" hidden>
                        휴대폰 번호
                    </label>

                    <input
                        type="tel"
                        id="phoneNumber"
                        name="phoneNumber"
                        class="login-input"
                        placeholder="휴대폰 번호를 입력해주세요"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="13"
                        required
                    >

                    <label for="password" hidden>
                        비밀번호
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="login-input"
                        placeholder="비밀번호를 입력해주세요"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- 로그인 버튼 -->
                <button
                    type="submit"
                    class="login-button"
                >
                    로그인
                </button>

            </form>

            <!-- 간편 로그인 -->
            <section class="easy-login">

                <h2 class="easy-login-title">
                    간편 로그인
                </h2>

                <div class="social-login-list">

    <a
        href="https://www.kakaocorp.com/page/"
        class="social-login-button"
    >
        <img
            src="./icons/kakao.svg"
            alt="카카오 로그인 아이콘"
            class="social-icon"
        >
    </a>

<a
    href="https://www.naver.com/"
    class="social-login-button"
>
        <img
            src="./icons/naver.svg"
            alt="네이버 로그인 아이콘"
            class="social-icon"
        >
    </a>

    <a
        href="https://www.google.co.kr/index.html"
        class="social-login-button"
    >
        <img
            src="./icons/google.svg"
            alt="구글 로그인 아이콘"
            class="social-icon"
        >
    </a>

    <a
        href="https://www.apple.com/kr/"
        class="social-login-button"
    >
        <img
            src="./icons/apple.svg"
            alt="애플 로그인 아이콘"
            class="social-icon"
        >
    </a>

</div>

            </section>

            <!-- 회원가입 및 계정 찾기 -->
            <nav
                class="account-menu"
                aria-label="회원 메뉴"
            >

                <a
                    href="./signup1.html"
                    class="account-link"
                >
                    회원가입
                </a>

                <a
                    href="./이동하는명령어"
                    class="account-link find-link"
                >
                    아이디 / 비밀번호 찾기
                </a>

            </nav>

        </div>

    </main>

    <script>
        /*
            로그인 폼을 제출하면 지정한 화면으로 이동합니다.
            실제 주소에 맞게 "./이동하는명령어" 부분을 수정하세요.
        */
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const phoneNumber =
                document.getElementById("phoneNumber").value.trim();

            const password =
                document.getElementById("password").value.trim();

            /*
                두 입력란에 값이 있을 때만 이동합니다.
            */
            if (phoneNumber !== "" && password !== "") {
                window.location.href = "./home.html";
            }
        });
    </script>

</body>
</html>
