<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div&span</title>
    <style>
        /*여백 초기화 */
        *{margin: 0;padding: 0;}
        div{
            /*박스 가로 사이즈*/
            width: 322px;
            /*박스 테두리선 두께 1px 검정색 실선*/
            border: 1px #000000 solid;
            padding: 38px 12px;
        }
        h1{margin-bottom: 64px;
        font-family: 궁서;
        font-size: 48px;
    }
        p{ margin-bottom: 64px;
        color: blue;}
        .last
        {
            margin-bottom: 0;
        }
        /*글자크기설정*/
        span{font-size: 42px;
        /*글자두께설정*/
            font-weight: 900;
            /*글자색상설정*/
            color: red;
            /*글자체설정*/
            font-family: 궁서;
        }
    </style>
</head>
<body>
    <div>
        <h1>표준 웹 기술</h1>
        <p><span>H</span>TML</p>
        <p><span>C</span>SS</p>
        <p class="last"><span>J</span>avascript</p>
    </div>
</body>
</html>
