<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>집반찬연구소 슬라이드</title>


    <!-- ========================================
         Swiper CSS
    ========================================= -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >


    <!-- ========================================
         내가 만든 CSS
    ========================================= -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>



    <!-- ========================================
         메인 배너 슬라이드 섹션 시작
    ========================================= -->
    <section class="main-slide-section">


        <!-- ========================================
             Swiper 전체
        ========================================= -->
        <div class="swiper mainSwiper">


            <!-- ========================================
                 슬라이드 목록
            ========================================= -->
            <div class="swiper-wrapper">


                <!-- 슬라이드 1 -->
                <div class="swiper-slide slide01">
                    <div class="slide-inner"></div>
                </div>


                <!-- 슬라이드 2 -->
                <div class="swiper-slide slide02">
                    <div class="slide-inner"></div>
                </div>


                <!-- 슬라이드 3 -->
                <div class="swiper-slide slide03">
                    <div class="slide-inner"></div>
                </div>


                <!-- 슬라이드 4 -->
                <div class="swiper-slide slide04">
                    <div class="slide-inner"></div>
                </div>


                <!-- 슬라이드 5 -->
                <div class="swiper-slide slide05">
                    <div class="slide-inner"></div>
                </div>


                <!-- 슬라이드 6 -->
                <div class="swiper-slide slide06">
                    <div class="slide-inner"></div>
                </div>


            </div>
            <!-- 슬라이드 목록 끝 -->



            <!-- ========================================
                 슬라이드 페이지 번호

                 예:
                 1 | 6
                 2 | 6
                 3 | 6
            ========================================= -->
            <div class="slide-counter">

                <!-- 현재 슬라이드 -->
                <span class="current-slide">
                    1
                </span>


                <!-- 가운데 구분선 -->
                <span class="counter-line"></span>


                <!-- 전체 슬라이드 -->
                <span class="total-slide">
                    6
                </span>

            </div>



            <!-- ========================================
                 좌우 슬라이드 버튼 영역
            ========================================= -->
            <div class="slide-control-inner">


                <div class="slide-arrow-box">


                    <!-- 이전 슬라이드 버튼 -->
                    <button
                        type="button"
                        class="main-prev"
                        aria-label="이전 슬라이드"
                    >

                        <img
                            src="./images/icon-arrow-left-a3a3a3-24.svg"
                            alt="이전"
                        >

                    </button>


                    <!-- 다음 슬라이드 버튼 -->
                    <button
                        type="button"
                        class="main-next"
                        aria-label="다음 슬라이드"
                    >

                        <img
                            src="./images/icon-arrow-right-a3a3a3-24.svg"
                            alt="다음"
                        >

                    </button>


                </div>
                <!-- slide-arrow-box 끝 -->


            </div>
            <!-- slide-control-inner 끝 -->


        </div>
        <!-- Swiper 끝 -->


    </section>
    <!-- 메인 배너 슬라이드 섹션 끝 -->
    <!-- ========================================
         Swiper JavaScript
         반드시 내가 만든 JS보다 먼저 연결
    ========================================= -->
    <script
        src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
    ></script>


    <!-- ========================================
         내가 만든 JavaScript
    ========================================= -->
    <script src="./js/script.js"></script>


</body>

</html>
