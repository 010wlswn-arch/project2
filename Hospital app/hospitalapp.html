<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 모바일 전용 화면 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>병원 위치 찾기</title>

    <!--
        ======================================================
        카카오 지도 JavaScript API

        YOUR_KAKAO_JAVASCRIPT_KEY 부분을
        본인의 카카오 JavaScript 키로 변경해주세요.

        예시
        appkey=1234567890abcdef1234567890abcdef

        카카오 개발자 사이트에서
        현재 사용하는 도메인도 등록해야 합니다.
        ======================================================
    -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cdc4a945f8e2d325d1b2c9a5baec7db3&libraries=services">
    </script>

    <style>
        /* =========================
           기본 초기화
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;

            background: #ffffff;
            color: #202936;

            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            background: none;
            cursor: pointer;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           전체 APP
        ========================= */

        .app {
            position: relative;

            width: 100%;
            min-height: 100svh;

            padding-bottom: 76px;

            background: #ffffff;
        }

        /* =========================
           상단 헤더
        ========================= */

        .header {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 72px;

            padding: 18px 16px 0;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
            color: #202936;
        }

        .header-button {
            position: absolute;
            bottom: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 40px;
        }

        .header-button.back {
            left: 8px;
        }

        .header-button.search {
            right: 8px;
        }

        .header-button img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* =========================
           메인 콘텐츠
        ========================= */

        .main {
            width: 100%;
            padding: 0 16px 18px;
        }

        /* =========================
           안내 문구
        ========================= */

        .intro {
            margin-top: 6px;
        }

        .intro-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.45;
            color: #202936;
        }

        .intro-description {
            margin-top: 2px;

            font-size: 16px;
            font-weight: 700;
            line-height: 1.45;
            color: #202936;
        }

        .intro-description strong {
            color: #4d8dff;
            font-weight: 700;
        }

        /* =========================
           검색창
        ========================= */

        .search-area {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-top: 16px;
        }

        .search-form {
            display: flex;
            align-items: center;
            flex: 1;

            min-width: 0;
            height: 48px;

            padding: 0 15px;

            border: 1px solid #d5dce5;
            border-radius: 16px;

            background: #ffffff;
        }

        .search-form img {
            flex: 0 0 auto;

            width: 22px;
            height: 22px;

            margin-right: 12px;
            object-fit: contain;
        }

        .search-input {
            width: 100%;
            min-width: 0;

            border: 0;
            outline: none;

            color: #202936;
            background: transparent;

            font-size: 13px;
            font-weight: 400;
        }

        .search-input::placeholder {
            color: #a9b2c0;
        }

        .filter-button {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;

            width: 48px;
            height: 48px;

            border: 1px solid #d5dce5;
            border-radius: 15px;

            background: #ffffff;
        }

        .filter-button img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* =========================
           진료과 필터
        ========================= */

        .category-scroll {
            width: 100%;
            margin-top: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-list {
            display: flex;
            align-items: center;
            gap: 9px;

            width: max-content;
            list-style: none;
        }

        .category-button {
            height: 30px;

            padding: 0 14px;

            border: 1px solid #d5dce5;
            border-radius: 9px;

            background: #ffffff;
            color: #3e4652;

            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .category-button.active {
            border-color: #4d8dff;
            background: #4d8dff;
            color: #ffffff;
        }

        /* =========================
           지도 영역
        ========================= */

        .map-section {
            position: relative;

            width: 100%;
            height: 288px;

            margin-top: 22px;

            overflow: hidden;

            border: 1px solid #e1e5eb;
            border-radius: 8px;

            background: #f5f6f8;
        }

        /* 실제 카카오 지도가 표시되는 영역 */
        #map {
            position: absolute;
            inset: 0 0 40px 0;
            z-index: 1;

            width: 100%;
            height: calc(100% - 40px);

            background: #f5f6f8;
        }

        /* 지도 로딩 안내 */
        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;

            transform: translate(-50%, -50%);

            color: #8c96a5;
            font-size: 13px;
            white-space: nowrap;

            pointer-events: none;
        }

        /* 지도 위 버튼 공통 */
        .map-floating-button {
            position: absolute;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 34px;

            border: 1px solid #d9dee6;
            border-radius: 8px;

            background: rgba(255, 255, 255, 0.96);
            color: #3e4652;

            box-shadow: 0 3px 6px rgba(22, 32, 48, 0.18);

            font-size: 12px;
            font-weight: 500;
        }

        .map-search-button {
            top: 12px;
            left: 18px;

            padding: 0 14px;
        }

        .map-list-button {
            top: 12px;
            right: 18px;

            gap: 8px;
            padding: 0 13px;
        }

        .map-list-button img {
            width: 17px;
            height: 17px;
            object-fit: contain;
        }

        /* 현재 위치 버튼 */
        .current-location-button {
            position: absolute;
            right: 20px;
            bottom: 59px;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border-radius: 50%;

            background: #e1e5ec;

            box-shadow: 0 3px 7px rgba(22, 32, 48, 0.16);
        }

        .current-location-button img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* 지도 하단 주소 배너 */
        .map-address-bar {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 12;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            height: 40px;

            padding: 0 14px;

            border-top: 1px solid #e3e7ed;

            background: #ffffff;
        }

        .map-address {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .map-address img {
            flex: 0 0 auto;

            width: 16px;
            height: 16px;

            margin-right: 8px;
            object-fit: contain;
        }

        .map-address-text {
            overflow: hidden;

            color: #586170;

            font-size: 11px;
            font-weight: 400;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .radius-button {
            display: flex;
            align-items: center;
            flex: 0 0 auto;

            margin-left: 10px;

            color: #586170;

            font-size: 11px;
            white-space: nowrap;
        }

        .radius-button img {
            width: 13px;
            height: 13px;

            margin-left: 6px;
            object-fit: contain;
        }

        /* =========================
           지도 오류 메시지
        ========================= */

        .map-message {
            position: absolute;
            top: 54px;
            left: 50%;
            z-index: 30;

            display: none;

            width: calc(100% - 40px);

            padding: 10px 12px;

            transform: translateX(-50%);

            border-radius: 8px;

            background: rgba(32, 41, 54, 0.88);
            color: #ffffff;

            font-size: 12px;
            line-height: 1.45;
            text-align: center;
        }

        .map-message.show {
            display: block;
        }

        /* =========================
           병원 목록
        ========================= */

        .hospital-section {
            width: 100%;
            margin-top: 16px;
            scroll-margin-top: 16px;
        }

        .hospital-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 9px;
        }

        .hospital-section-title {
            font-size: 16px;
            font-weight: 700;
            color: #202936;
        }

        .sort-button {
            display: flex;
            align-items: center;

            color: #6b7482;

            font-size: 11px;
        }

        .sort-button img {
            width: 13px;
            height: 13px;

            margin-left: 7px;
            object-fit: contain;
        }

        .hospital-list {
            display: flex;
            flex-direction: column;
            gap: 9px;

            width: 100%;
            list-style: none;
        }

        .hospital-item {
            width: 100%;
        }

        .hospital-card {
            display: flex;
            align-items: center;

            width: 100%;
            min-height: 90px;

            padding: 11px 10px;

            border: 1px solid #aab6c7;
            border-radius: 8px;

            background: #ffffff;

            cursor: pointer;
        }

        .hospital-card:active {
            background: #f7f9fc;
        }

        .hospital-thumbnail {
            flex: 0 0 auto;

            width: 52px;
            height: 64px;

            margin-right: 9px;

            overflow: hidden;
            border-radius: 5px;

            background: #eef4ff;
        }

        .hospital-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hospital-information {
            min-width: 0;
            flex: 1;
        }

        .hospital-name {
            overflow: hidden;

            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            color: #202936;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .hospital-department {
            margin-top: 2px;

            overflow: hidden;

            color: #6d7684;

            font-size: 10px;
            line-height: 1.4;

            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .hospital-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;

            margin-top: 5px;
        }

        .meta-item {
            display: flex;
            align-items: center;

            color: #313945;

            font-size: 10px;
            line-height: 1;
            white-space: nowrap;
        }

        .meta-item img {
            width: 12px;
            height: 12px;

            margin-right: 3px;
            object-fit: contain;
        }

        .meta-item.location {
            padding: 3px 5px;
            border-radius: 4px;
            background: #f0f1f3;
        }

        .hospital-action-area {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;

            min-width: 76px;
            min-height: 62px;

            margin-left: 8px;
        }

        .remote-badge {
            padding: 6px 8px;

            border-radius: 10px;

            background: #eef5ff;
            color: #4d8dff;

            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
        }

        .route-button {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 27px;

            padding: 4px 7px;

            border-radius: 7px;

            color: #28313e;
            background: #f5f7fa;

            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
        }

        .route-button:active {
            background: #e9edf3;
        }

        /* 검색 결과 없음 */
        .empty-result {
            display: none;

            width: 100%;
            padding: 50px 20px;

            color: #8a94a3;

            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .empty-result.show {
            display: block;
        }

        /* =========================
           하단 내비게이션
        ========================= */

        .bottom-navigation {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-around;

            width: 100%;
            height: 72px;

            padding-bottom: env(safe-area-inset-bottom);

            border-top: 1px solid #e1e5eb;

            background: rgba(255, 255, 255, 0.98);
        }

        .bottom-navigation-item {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            width: 20%;
            height: 100%;

            color: #515c6a;

            font-size: 10px;
        }

        .bottom-navigation-item img {
            width: 24px;
            height: 24px;

            margin-bottom: 4px;
            object-fit: contain;
        }

        .bottom-navigation-item.active {
            color: #4d8dff;
        }

        /* =========================
           선택 팝업
        ========================= */

        .radius-popup {
            position: absolute;
            right: 8px;
            bottom: 43px;
            z-index: 50;

            display: none;

            width: 110px;

            overflow: hidden;

            border: 1px solid #dce1e8;
            border-radius: 9px;

            background: #ffffff;
            box-shadow: 0 5px 15px rgba(25, 35, 50, 0.16);
        }

        .radius-popup.show {
            display: block;
        }

        .radius-option {
            display: block;

            width: 100%;
            height: 38px;

            padding: 0 13px;

            border-bottom: 1px solid #edf0f4;

            color: #424b58;
            background: #ffffff;

            font-size: 12px;
            text-align: left;
        }

        .radius-option:last-child {
            border-bottom: 0;
        }

        .radius-option.active {
            color: #4d8dff;
            font-weight: 700;
            background: #f2f7ff;
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- =========================
             헤더
        ========================== -->
        <header class="header">
            <button
                type="button"
                class="header-button back"
                id="backButton"
                aria-label="뒤로 가기"
            >
                <img
                    src="./icons/prev.svg"
                    alt="뒤로가기 아이콘"
                >
            </button>

            <h1 class="header-title">병원 위치 찾기</h1>

            <button
                type="button"
                class="header-button search"
                id="headerSearchButton"
                aria-label="병원 검색창 선택"
            >
                <img
                    src="./icons/search.svg"
                    alt="검색아이콘"
                >
            </button>
        </header>

        <!-- =========================
             메인
        ========================== -->
        <main class="main">

            <section class="intro">
                <p class="intro-title">내 주변 병원을</p>

                <p class="intro-description">
                    <strong>지도에서</strong> 확인해보세요
                </p>
            </section>

            <!-- 검색 영역 -->
            <section class="search-area">
                <form class="search-form" id="hospitalSearchForm">
                    <img
                        src="./icons/search(2).svg"
                        alt="검색아이콘"
                    >

                    <input
                        type="search"
                        class="search-input"
                        id="hospitalSearchInput"
                        placeholder="병원, 진료과 의사명을 검색해보세요."
                        autocomplete="off"
                    >
                </form>

                <button
                    type="button"
                    class="filter-button"
                    id="filterButton"
                    aria-label="필터"
                >
                    <img
                        src="./icons/set.svg"
                        alt="필터버튼 아이콘"
                    >
                </button>
            </section>

            <!-- 진료과목 -->
            <nav
                class="category-scroll"
                aria-label="진료과 선택"
            >
                <ul class="category-list">
                    <li>
                        <button
                            type="button"
                            class="category-button active"
                            data-category="전체"
                        >
                            전체
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="category-button"
                            data-category="내과"
                        >
                            내과
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="category-button"
                            data-category="정형외과"
                        >
                            정형외과
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="category-button"
                            data-category="치과"
                        >
                            치과
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="category-button"
                            data-category="피부과"
                        >
                            피부과
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="category-button"
                            data-category="소아과"
                        >
                            소아과
                        </button>
                    </li>
                </ul>
            </nav>

            <!-- =========================
                 지도
            ========================== -->
            <section
                class="map-section"
                aria-label="병원 지도"
            >
                <!-- 이 영역 뒤에 실제 카카오 지도가 생성됩니다. -->
                <div id="map"></div>

                <p
                    class="map-loading"
                    id="mapLoading"
                >
                    지도를 불러오는 중입니다.
                </p>

                <!-- 지도 위 왼쪽 버튼 -->
                <button
                    type="button"
                    class="map-floating-button map-search-button"
                    id="searchCurrentMapButton"
                >
                    현 지도에서 검색
                </button>

                <!-- 지도 위 오른쪽 버튼 -->
                <button
                    type="button"
                    class="map-floating-button map-list-button"
                    id="showListButton"
                >
                    <img
                        src="./icons/chexk-list.svg"
                        alt="지도 목록 아이콘"
                    >
                    <span>목록 보기</span>
                </button>

                <!-- 현재 위치 버튼 -->
                <button
                    type="button"
                    class="current-location-button"
                    id="currentLocationButton"
                    aria-label="현재 위치로 이동"
                >
                    <img
                        src="./icons/gps.svg"
                        alt="현재 위치로 이동 아이콘"
                    >
                </button>

                <!-- 지도 알림 -->
                <div
                    class="map-message"
                    id="mapMessage"
                    role="status"
                ></div>

                <!-- 지도 하단 주소 -->
                <div class="map-address-bar">
                    <div class="map-address">
                        <img
                            src="./icons/pin.svg"
                            alt="위치핀 아이콘"
                        >

                        <span
                            class="map-address-text"
                            id="currentAddressText"
                        >
                            서울특별시 강남구 테헤란로 123 기준
                        </span>
                    </div>

                    <button
                        type="button"
                        class="radius-button"
                        id="radiusButton"
                    >
                        <span id="radiusText">반경 2km</span>

                        <img
                            src="./icons/down.svg"
                            alt="아래 화살표 아이콘"
                        >
                    </button>
                </div>

                <!-- 검색 반경 선택 -->
                <div
                    class="radius-popup"
                    id="radiusPopup"
                >
                    <button
                        type="button"
                        class="radius-option"
                        data-radius="1"
                    >
                        반경 1km
                    </button>

                    <button
                        type="button"
                        class="radius-option active"
                        data-radius="2"
                    >
                        반경 2km
                    </button>

                    <button
                        type="button"
                        class="radius-option"
                        data-radius="3"
                    >
                        반경 3km
                    </button>

                    <button
                        type="button"
                        class="radius-option"
                        data-radius="5"
                    >
                        반경 5km
                    </button>
                </div>
            </section>

            <!-- =========================
                 병원 목록
            ========================== -->
            <section
                class="hospital-section"
                id="hospitalSection"
            >
                <div class="hospital-section-header">
                    <h2
                        class="hospital-section-title"
                        id="hospitalCountTitle"
                    >
                        내 주변 병원 3곳
                    </h2>

                    <button
                        type="button"
                        class="sort-button"
                        id="sortButton"
                    >
                        <span id="sortText">거리순</span>

                        <img
                            src="./icons/down.svg"
                            alt="아래 화살표 아이콘"
                        >
                    </button>

    <script>
        "use strict";

        /* =====================================================
           1. 병원 데이터

           detailUrl에 나중에 제작할 두 번째 화면 링크를 넣으세요.

           예:
           detailUrl: "./hospital-detail.html"

           또는 병원마다 다른 페이지를 사용할 수도 있습니다.
           ===================================================== */

        const hospitalData = [
            {
                id: 1,
                name: "큐링크 종합병원",
                departments: ["내과", "정형외과"],
                departmentText: "내과 · 정형외과 외 12개 진료과",
                rating:  4.6,
                distance: 1.2,
                station: "역삼역 3번 출구",
                waitTime: "예상 대기 25분",
                image: "./images/hospitalimage .svg",
                latitude: 37.500663,
                longitude: 127.036396,
                address: "서울특별시 강남구 테헤란로 123",
                detailUrl: "./hospital-detail.html?id=1"
            },
            {
                id: 2,
                name: "강남 연세 내과 의원",
                departments: ["내과", "소아과"],
                departmentText: "내과 · 소화기내과",
                rating: 4.3,
                distance: 1.5,
                station: "강남역 5번 출구",
                waitTime: "예상 대기 15분",
                image: "./images/hospitalimage .svg",
                latitude: 37.498118,
                longitude: 127.028063,
                address: "서울특별시 강남구 강남대로 410",
                detailUrl: "./hospital-detail.html?id=2"
            },
            {
                id: 3,
                name: "세브란스 정형외과",
                departments: ["정형외과"],
                departmentText: "정형외과",
                rating: 4.8,
                distance: 1.8,
                station: "논현역 2번 출구",
                waitTime: "예상 대기 30분",
                image: "./images/hospitalimage .svg",
                latitude: 37.511093,
                longitude: 127.021431,
                address: "서울특별시 강남구 학동로 151",
                detailUrl: "./hospital-detail.html?id=3"
            }
        ];

        /* =====================================================
           2. 전역 변수
        ===================================================== */

        const DEFAULT_LOCATION = {
            latitude: 37.500663,
            longitude: 127.036396,
            address: "서울특별시 강남구 테헤란로 123"
        };

        let map = null;
        let geocoder = null;
        let currentLocationMarker = null;

        let hospitalMarkers = [];
        let markerInformationWindows = [];

        let currentLatitude = DEFAULT_LOCATION.latitude;
        let currentLongitude = DEFAULT_LOCATION.longitude;

        let selectedCategory = "전체";
        let selectedRadius = 2;
        let currentKeyword = "";
        let sortMode = "distance";

        let mapMessageTimer = null;

        /* =====================================================
           3. DOM 요소
        ===================================================== */

        const mapLoading = document.getElementById("mapLoading");
        const mapMessage = document.getElementById("mapMessage");

        const hospitalSearchForm =
            document.getElementById("hospitalSearchForm");

        const hospitalSearchInput =
            document.getElementById("hospitalSearchInput");

        const hospitalList =
            document.getElementById("hospitalList");

        const hospitalCountTitle =
            document.getElementById("hospitalCountTitle");

        const emptyResult =
            document.getElementById("emptyResult");

        const hospitalSection =
            document.getElementById("hospitalSection");

        const currentAddressText =
            document.getElementById("currentAddressText");

        const radiusPopup =
            document.getElementById("radiusPopup");

        const radiusText =
            document.getElementById("radiusText");

        const sortText =
            document.getElementById("sortText");

        /* =====================================================
           4. 카카오맵 초기화
        ===================================================== */

        function initializeKakaoMap() {
            if (
                typeof window.kakao === "undefined" ||
                typeof window.kakao.maps === "undefined"
            ) {
                mapLoading.textContent =
                    "카카오 API 키를 확인해주세요.";

                showMapMessage(
                    "카카오 JavaScript 키 또는 등록된 도메인을 확인해주세요."
                );

                renderHospitals();
                return;
            }

            const mapContainer = document.getElementById("map");

            const mapOptions = {
                center: new kakao.maps.LatLng(
                    DEFAULT_LOCATION.latitude,
                    DEFAULT_LOCATION.longitude
                ),
                level: 5
            };

            map = new kakao.maps.Map(
                mapContainer,
                mapOptions
            );

            geocoder = new kakao.maps.services.Geocoder();

            mapLoading.style.display = "none";

            createHospitalMarkers(hospitalData);

            requestCurrentLocation({
                moveMap: true,
                showError: false
            });

            kakao.maps.event.addListener(
                map,
                "dragend",
                function () {
                    updateAddressFromMapCenter();
                }
            );

            kakao.maps.event.addListener(
                map,
                "zoom_changed",
                function () {
                    updateAddressFromMapCenter();
                }
            );
        }

        /* =====================================================
           5. 현재 위치 가져오기
        ===================================================== */

        function requestCurrentLocation(options = {}) {
            const {
                moveMap = true,
                showError = true
            } = options;

            if (!navigator.geolocation) {
                if (showError) {
                    showMapMessage(
                        "현재 브라우저에서는 위치 기능을 지원하지 않습니다."
                    );
                }

                useDefaultLocation(moveMap);
                return;
            }

            showMapMessage("현재 위치를 확인하고 있습니다.");

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    currentLatitude =
                        position.coords.latitude;

                    currentLongitude =
                        position.coords.longitude;

                    const currentPosition =
                        new kakao.maps.LatLng(
                            currentLatitude,
                            currentLongitude
                        );

                    if (moveMap && map) {
                        map.setCenter(currentPosition);
                        map.setLevel(5);
                    }

                    createCurrentLocationMarker(
                        currentPosition
                    );

                    updateCurrentAddress(
                        currentLongitude,
                        currentLatitude
                    );

                    updateHospitalDistances();

                    renderHospitals();

                    showMapMessage(
                        "현재 위치를 기준으로 병원을 표시했습니다."
                    );
                },

                function (error) {
                    useDefaultLocation(moveMap);

                    if (!showError) {
                        return;
                    }

                    let errorMessage =
                        "현재 위치를 가져올 수 없습니다.";

                    if (error.code === 1) {
                        errorMessage =
                            "위치 권한이 차단되었습니다. 브라우저에서 위치 권한을 허용해주세요.";
                    }

                    if (error.code === 2) {
                        errorMessage =
                            "현재 위치 정보를 확인할 수 없습니다.";
                    }

                    if (error.code === 3) {
                        errorMessage =
                            "현재 위치 확인 시간이 초과되었습니다.";
                    }

                    showMapMessage(errorMessage);
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        function useDefaultLocation(moveMap) {
            currentLatitude =
                DEFAULT_LOCATION.latitude;

            currentLongitude =
                DEFAULT_LOCATION.longitude;

            currentAddressText.textContent =
                DEFAULT_LOCATION.address + " 기준";

            if (!map) {
                renderHospitals();
                return;
            }

            const defaultPosition =
                new kakao.maps.LatLng(
                    currentLatitude,
                    currentLongitude
                );

            if (moveMap) {
                map.setCenter(defaultPosition);
            }

            createCurrentLocationMarker(
                defaultPosition
            );

            updateHospitalDistances();
            renderHospitals();
        }

        /* =====================================================
           6. 현재 위치 마커
        ===================================================== */

        function createCurrentLocationMarker(position) {
            if (!map) {
                return;
            }

            if (currentLocationMarker) {
                currentLocationMarker.setMap(null);
            }

            /*
                현재 위치용 마커 이미지입니다.

                준비할 이미지:
                ./images/map-current-marker.png
            */

            const markerImageSize =
                new kakao.maps.Size(24, 24);

            const markerImageOption = {
                offset: new kakao.maps.Point(12, 12)
            };

            const markerImage =
                new kakao.maps.MarkerImage(
                    "./icons/icons_locationpin.svg",
                    markerImageSize,
                    markerImageOption
                );

            currentLocationMarker =
                new kakao.maps.Marker({
                    map: map,
                    position: position,
                    image: markerImage,
                    zIndex: 20
                });
        }

        /* =====================================================
           7. 병원 마커 생성
        ===================================================== */

        function createHospitalMarkers(hospitals) {
            if (!map) {
                return;
            }

            removeHospitalMarkers();

            hospitals.forEach(function (hospital, index) {
                const markerPosition =
                    new kakao.maps.LatLng(
                        hospital.latitude,
                        hospital.longitude
                    );

                /*
                    병원 위치용 마커 이미지입니다.

                    준비할 이미지:
                    ./images/map-hospital-marker.png

                    이미지가 없다면 아래 image 속성 한 줄을
                    삭제하면 카카오 기본 마커가 표시됩니다.
                */

                const markerImageSize =
                    new kakao.maps.Size(34, 42);

                const markerImageOption = {
                    offset: new kakao.maps.Point(17, 42)
                };

                const markerImage =
                    new kakao.maps.MarkerImage(
                        "./icons/location.svg",
                        markerImageSize,
                        markerImageOption
                    );

                const marker =
                    new kakao.maps.Marker({
                        map: map,
                        position: markerPosition,
                        image: markerImage,
                        title: hospital.name
                    });

                const informationWindow =
                    new kakao.maps.InfoWindow({
                        content: createInfoWindowContent(
                            hospital,
                            index + 1
                        ),
                        removable: false
                    });

                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        closeAllInformationWindows();

                        informationWindow.open(
                            map,
                            marker
                        );

                        map.panTo(markerPosition);
                    }
                );

                hospitalMarkers.push(marker);
                markerInformationWindows.push(
                    informationWindow
                );
            });
        }

        function createInfoWindowContent(
            hospital,
            number
        ) {
            return `
                <div style="
                    min-width:150px;
                    padding:10px 12px;
                    color:#202936;
                    font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                    font-size:12px;
                    line-height:1.45;
                    text-align:left;
                ">
                    <strong style="
                        display:block;
                        margin-bottom:3px;
                        font-size:13px;
                    ">
                        ${number}. ${escapeHtml(hospital.name)}
                    </strong>

                    <span style="color:#697382;">
                        ${escapeHtml(hospital.departmentText)}
                    </span>
                </div>
            `;
        }

        function removeHospitalMarkers() {
            hospitalMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            closeAllInformationWindows();

            hospitalMarkers = [];
            markerInformationWindows = [];
        }

        function closeAllInformationWindows() {
            markerInformationWindows.forEach(
                function (informationWindow) {
                    informationWindow.close();
                }
            );
        }

        /* =====================================================
           8. 주소 변환
        ===================================================== */

        function updateCurrentAddress(
            longitude,
            latitude
        ) {
            if (!geocoder) {
                return;
            }

            geocoder.coord2Address(
                longitude,
                latitude,
                function (result, status) {
                    if (
                        status ===
                            kakao.maps.services.Status.OK &&
                        result.length > 0
                    ) {
                        const roadAddress =
                            result[0].road_address;

                        const parcelAddress =
                            result[0].address;

                        const address =
                            roadAddress
                                ? roadAddress.address_name
                                : parcelAddress.address_name;

                        currentAddressText.textContent =
                            address + " 기준";
                    }
                }
            );
        }

        function updateAddressFromMapCenter() {
            if (!map) {
                return;
            }

            const center = map.getCenter();

            updateCurrentAddress(
                center.getLng(),
                center.getLat()
            );
        }

        /* =====================================================
           9. 거리 계산
        ===================================================== */

        function calculateDistance(
            startLatitude,
            startLongitude,
            endLatitude,
            endLongitude
        ) {
            const earthRadius = 6371;

            const latitudeDifference =
                toRadians(
                    endLatitude - startLatitude
                );

            const longitudeDifference =
                toRadians(
                    endLongitude - startLongitude
                );

            const firstLatitude =
                toRadians(startLatitude);

            const secondLatitude =
                toRadians(endLatitude);

            const value =
                Math.sin(latitudeDifference / 2) *
                    Math.sin(latitudeDifference / 2) +
                Math.cos(firstLatitude) *
                    Math.cos(secondLatitude) *
                    Math.sin(longitudeDifference / 2) *
                    Math.sin(longitudeDifference / 2);

            const angularDistance =
                2 *
                Math.atan2(
                    Math.sqrt(value),
                    Math.sqrt(1 - value)
                );

            return earthRadius * angularDistance;
        }

        function toRadians(degree) {
            return degree * (Math.PI / 180);
        }

        function updateHospitalDistances() {
            hospitalData.forEach(function (hospital) {
                hospital.distance =
                    calculateDistance(
                        currentLatitude,
                        currentLongitude,
                        hospital.latitude,
                        hospital.longitude
                    );
            });
        }

        /* =====================================================
           10. 병원 목록 필터
        ===================================================== */

        function getFilteredHospitals() {
            const keyword =
                currentKeyword
                    .trim()
                    .toLowerCase();

            let filteredHospitals =
                hospitalData.filter(function (hospital) {
                    const categoryMatched =
                        selectedCategory === "전체" ||
                        hospital.departments.includes(
                            selectedCategory
                        );

                    const keywordTarget = [
                        hospital.name,
                        hospital.departmentText,
                        hospital.address,
                        hospital.station
                    ]
                        .join(" ")
                        .toLowerCase();

                    const keywordMatched =
                        keyword === "" ||
                        keywordTarget.includes(keyword);

                    const radiusMatched =
                        hospital.distance <=
                        selectedRadius;

                    return (
                        categoryMatched &&
                        keywordMatched &&
                        radiusMatched
                    );
                });

            filteredHospitals =
                [...filteredHospitals].sort(
                    function (first, second) {
                        if (sortMode === "rating") {
                            return (
                                second.rating -
                                first.rating
                            );
                        }

                        return (
                            first.distance -
                            second.distance
                        );
                    }
                );

            return filteredHospitals;
        }

        /* =====================================================
           11. 병원 목록 출력
        ===================================================== */

        function renderHospitals() {
            const filteredHospitals =
                getFilteredHospitals();

            hospitalList.innerHTML = "";

            hospitalCountTitle.textContent =
                `내 주변 병원 ${filteredHospitals.length}곳`;

            emptyResult.classList.toggle(
                "show",
                filteredHospitals.length === 0
            );

            filteredHospitals.forEach(
                function (hospital) {
                    const hospitalItem =
                        document.createElement("li");

                    hospitalItem.className =
                        "hospital-item";

                    hospitalItem.innerHTML =
                        createHospitalCard(hospital);

                    const hospitalCard =
                        hospitalItem.querySelector(
                            ".hospital-card"
                        );

                    const routeButton =
                        hospitalItem.querySelector(
                            ".route-button"
                        );

                    hospitalCard.addEventListener(
                        "click",
                        function () {
                            moveToHospitalDetail(
                                hospital
                            );
                        }
                    );

                    hospitalCard.addEventListener(
                        "keydown",
                        function (event) {
                            if (
                                event.key === "Enter" ||
                                event.key === " "
                            ) {
                                event.preventDefault();

                                moveToHospitalDetail(
                                    hospital
                                );
                            }
                        }
                    );

                    routeButton.addEventListener(
                        "click",
                        function (event) {
                            event.preventDefault();
                            event.stopPropagation();

                            openKakaoDirections(
                                hospital
                            );
                        }
                    );

                    hospitalList.appendChild(
                        hospitalItem
                    );
                }
            );

            createHospitalMarkers(
                filteredHospitals
            );
        }

        function createHospitalCard(hospital) {
            const formattedDistance =
                hospital.distance < 0.1
                    ? "100m 이내"
                    : `${hospital.distance.toFixed(1)}km`;

            return `
                <article
                    class="hospital-card"
                    role="link"
                    tabindex="0"
                    aria-label="${escapeHtml(hospital.name)} 상세 화면으로 이동"
                >
                    <div class="hospital-thumbnail">
                        <img
                            src="${hospital.image}"
                            alt="${escapeHtml(hospital.name)} 건물"
                        >
                    </div>

                    <div class="hospital-information">
                        <h3 class="hospital-name">
                            ${escapeHtml(hospital.name)}
                        </h3>

                        <p class="hospital-department">
                            ${escapeHtml(hospital.departmentText)}
                        </p>

                        <div class="hospital-meta">
                            <span class="meta-item">
                                <img
                                    src="./images/icon-star.svg"
                                    alt=""
                                >
                                ${hospital.rating.toFixed(1)}
                            </span>

                            <span class="meta-item">
                                ${formattedDistance}
                            </span>

                            <span class="meta-item location">
                                ${escapeHtml(hospital.station)}
                            </span>
                        </div>
                    </div>

                    <div class="hospital-action-area">
                        <span class="remote-badge">
                            원격 접수 가능
                        </span>

                        <button
                            type="button"
                            class="route-button"
                            aria-label="${escapeHtml(hospital.name)}까지 길찾기"
                        >
                            ${escapeHtml(hospital.waitTime)}
                        </button>
                    </div>
                </article>
            `;
        }

        /* =====================================================
           12. 상세 화면 이동

           두 번째 화면을 만든 후 hospitalData의 detailUrl만
           원하는 주소로 바꿔주세요.
        ===================================================== */

        function moveToHospitalDetail(hospital) {
            if (!hospital.detailUrl) {
                showMapMessage(
                    "상세 화면 링크를 hospitalData에 입력해주세요."
                );

                return;
            }

            window.location.href =
                hospital.detailUrl;
        }

        /* =====================================================
           13. 카카오맵 길찾기

           현재 위치 → 선택한 병원
        ===================================================== */

        function openKakaoDirections(hospital) {
            const startName =
                encodeURIComponent("현재 위치");

            const destinationName =
                encodeURIComponent(hospital.name);

            const startLocation =
                `${startName},${currentLatitude},${currentLongitude}`;

            const destinationLocation =
                `${destinationName},${hospital.latitude},${hospital.longitude}`;

            const directionsUrl =
                "https://map.kakao.com/link/from/" +
                startLocation +
                "/to/" +
                destinationLocation;

            window.open(
                directionsUrl,
                "_blank",
                "noopener,noreferrer"
            );
        }

        /* =====================================================
           14. 현 지도에서 검색
        ===================================================== */

        function searchHospitalsOnCurrentMap() {
            if (!map) {
                renderHospitals();
                return;
            }

            const mapCenter = map.getCenter();

            currentLatitude =
                mapCenter.getLat();

            currentLongitude =
                mapCenter.getLng();

            updateHospitalDistances();
            updateAddressFromMapCenter();
            renderHospitals();

            showMapMessage(
                `현재 지도 중심의 반경 ${selectedRadius}km 병원을 검색했습니다.`
            );
        }

        /* =====================================================
           15. 이벤트 연결
        ===================================================== */

        document
            .getElementById("backButton")
            .addEventListener(
                "click",
                function () {
                    if (window.history.length > 1) {
                        window.history.back();
                        return;
                    }

                    window.location.href =
                        "./home.html";
                }
            );

        document
            .getElementById(
                "headerSearchButton"
            )
            .addEventListener(
                "click",
                function () {
                    hospitalSearchInput.focus();
                }
            );

        hospitalSearchForm.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                currentKeyword =
                    hospitalSearchInput.value;

                renderHospitals();

                hospitalSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        );

        hospitalSearchInput.addEventListener(
            "input",
            function () {
                currentKeyword =
                    hospitalSearchInput.value;

                renderHospitals();
            }
        );

        document
            .querySelectorAll(
                ".category-button"
            )
            .forEach(function (button) {
                button.addEventListener(
                    "click",
                    function () {
                        selectedCategory =
                            button.dataset.category;

                        document
                            .querySelectorAll(
                                ".category-button"
                            )
                            .forEach(
                                function (categoryButton) {
                                    categoryButton
                                        .classList
                                        .remove("active");
                                }
                            );

                        button.classList.add(
                            "active"
                        );

                        renderHospitals();
                    }
                );
            });

        document
            .getElementById(
                "currentLocationButton"
            )
            .addEventListener(
                "click",
                function () {
                    requestCurrentLocation({
                        moveMap: true,
                        showError: true
                    });
                }
            );

        document
            .getElementById(
                "searchCurrentMapButton"
            )
            .addEventListener(
                "click",
                searchHospitalsOnCurrentMap
            );

        document
            .getElementById(
                "showListButton"
            )
            .addEventListener(
                "click",
                function () {
                    hospitalSection.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }
            );

        document
            .getElementById("filterButton")
            .addEventListener(
                "click",
                function () {
                    const categoryNavigation =
                        document.querySelector(
                            ".category-scroll"
                        );

                    categoryNavigation.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });
                }
            );

        document
            .getElementById("radiusButton")
            .addEventListener(
                "click",
                function (event) {
                    event.stopPropagation();

                    radiusPopup.classList.toggle(
                        "show"
                    );
                }
            );

        document
            .querySelectorAll(
                ".radius-option"
            )
            .forEach(function (button) {
                button.addEventListener(
                    "click",
                    function () {
                        selectedRadius =
                            Number(
                                button.dataset.radius
                            );

                        radiusText.textContent =
                            `반경 ${selectedRadius}km`;

                        document
                            .querySelectorAll(
                                ".radius-option"
                            )
                            .forEach(
                                function (radiusButton) {
                                    radiusButton
                                        .classList
                                        .remove("active");
                                }
                            );

                        button.classList.add(
                            "active"
                        );

                        radiusPopup.classList.remove(
                            "show"
                        );

                        renderHospitals();
                    }
                );
            });

        document
            .getElementById("sortButton")
            .addEventListener(
                "click",
                function () {
                    if (sortMode === "distance") {
                        sortMode = "rating";
                        sortText.textContent =
                            "평점순";
                    } else {
                        sortMode = "distance";
                        sortText.textContent =
                            "거리순";
                    }

                    renderHospitals();
                }
            );

        document.addEventListener(
            "click",
            function (event) {
                const radiusButton =
                    document.getElementById(
                        "radiusButton"
                    );

                if (
                    !radiusPopup.contains(
                        event.target
                    ) &&
                    !radiusButton.contains(
                        event.target
                    )
                ) {
                    radiusPopup.classList.remove(
                        "show"
                    );
                }
            }
        );

        /* 지도 크기 재계산 */
        window.addEventListener(
            "load",
            function () {
                renderHospitals();
                initializeKakaoMap();
            }
        );

        window.addEventListener(
            "resize",
            function () {
                if (map) {
                    map.relayout();
                }
            }
        );

        /* =====================================================
           16. 공통 함수
        ===================================================== */

        function showMapMessage(message) {
            window.clearTimeout(
                mapMessageTimer
            );

            mapMessage.textContent = message;
            mapMessage.classList.add("show");

            mapMessageTimer =
                window.setTimeout(
                    function () {
                        mapMessage.classList.remove(
                            "show"
                        );
                    },
                    2600
                );
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>
</body>
</html>
