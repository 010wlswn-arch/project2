<!DOCTYPE html>
<html lang="en">
<head>

    <title>한국 영재 올림피아드</title>
    <style>

     h1{

    }
    h2{
        background:#d3d3d3;
        text-align:center;
        font-size:24px;
        font-weight:normal;
        padding:10px 0;
        margin-bottom:24px;
    }
    ul{
        margin-left:40px;
        margin-bottom:36px;
    }
    p{
        line-height:2;
        margin-bottom:26px;
    }

    </style>
</head>
<body>
    <div class="wrap">

    <p>

        격려를 아끼지 않습니다.

    <p>
        과학에 관심있고 재능있는 여러분들의 도전을 응원하겠습니다!!
