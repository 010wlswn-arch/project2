<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>오늘할일 5단계 QA 점검</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./stage5.css">
  <style>
    body { min-height: 100vh; padding: 32px 18px; }
    .qa-wrap { width: min(880px, 100%); margin: 0 auto; }
    .qa-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .qa-header h1 { margin: 0; font-size: 28px; }
    .qa-header p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
    .qa-summary { flex: 0 0 auto; padding: 12px 15px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); font-weight: 800; }
    .qa-card { margin-top: 16px; padding: 22px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); }
    .qa-card h2 { margin: 0 0 16px; font-size: 17px; }
    .qa-list { display: grid; gap: 9px; }
    .qa-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .qa-item:last-child { border-bottom: 0; }
    .qa-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
    .qa-dot.pass { background: var(--green); }
    .qa-dot.fail { background: var(--red); }
    .qa-copy strong { display: block; font-size: 14px; }
    .qa-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .qa-result { color: var(--muted); font-size: 12px; font-weight: 750; }
    .manual-list { display: grid; gap: 12px; }
    .manual-item { display: flex; align-items: flex-start; gap: 10px; color: var(--text); line-height: 1.55; }
    .manual-item input { width: 19px; height: 19px; margin-top: 1px; accent-color: var(--primary); }
    .qa-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    .qa-link { display: inline-flex; align-items: center; min-height: 42px; padding: 0 15px; border-radius: 11px; background: var(--primary); color: #fff; font-weight: 750; text-decoration: none; }
    @media (max-width: 600px) { body { padding: 20px 12px; } .qa-header { flex-direction: column; } .qa-summary { align-self: stretch; text-align: center; } .qa-item { grid-template-columns: auto 1fr; } .qa-result { grid-column: 2; } }
  </style>
</head>
<body>
  <main class="qa-wrap">
    <header class="qa-header">
      <div><p class="eyebrow">오늘할일 v1.0.0</p><h1>5단계 출시 전 QA</h1><p>자동 점검 결과와 실제 기기에서 확인할 항목을 함께 관리합니다.</p></div>
      <div class="qa-summary" id="qaSummary" role="status" aria-live="polite">점검 준비 중</div>
    </header>

    <section class="qa-card" aria-labelledby="autoTitle">
      <h2 id="autoTitle">자동 점검</h2>
      <div class="qa-list" id="autoChecks"></div>
      <div class="qa-actions"><button class="button primary" id="runQa" type="button">다시 점검</button><a class="qa-link" href="./index.html">앱 화면 열기</a></div>
    </section>

    <section class="qa-card" aria-labelledby="manualTitle">
      <h2 id="manualTitle">실제 기기 수동 점검</h2>
      <div class="manual-list" id="manualChecks">
        <label class="manual-item"><input type="checkbox" value="desktop"><span>PC 1200px 이상에서 사이드바·본문·요약 패널이 겹치지 않는다.</span></label>
        <label class="manual-item"><input type="checkbox" value="tablet"><span>태블릿 768~1199px에서 요약 패널이 숨겨지고 주요 기능을 사용할 수 있다.</span></label>
        <label class="manual-item"><input type="checkbox" value="mobile"><span>모바일 320~767px에서 하단 메뉴와 추가 버튼이 화면 밖으로 벗어나지 않는다.</span></label>
        <label class="manual-item"><input type="checkbox" value="crud"><span>할 일 등록·수정·완료·삭제·되돌리기 후 새로고침해도 데이터가 유지된다.</span></label>
        <label class="manual-item"><input type="checkbox" value="offline"><span>온라인에서 한 번 실행한 뒤 오프라인으로 전환해도 앱 화면이 열린다.</span></label>
        <label class="manual-item"><input type="checkbox" value="backup"><span>JSON 내보내기 후 불러오기가 정상이며 CSV 파일의 한글이 깨지지 않는다.</span></label>
        <label class="manual-item"><input type="checkbox" value="keyboard"><span>Tab·Shift+Tab·Enter·Esc 키만으로 메뉴와 모달을 조작할 수 있다.</span></label>
        <label class="manual-item"><input type="checkbox" value="browser"><span>Chrome·Edge·Firefox·Safari 최신 버전에서 핵심 기능을 확인했다.</span></label>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';
      var checksElement = document.getElementById('autoChecks');
      var summaryElement = document.getElementById('qaSummary');
      var manualInputs = document.querySelectorAll('#manualChecks input');
      var storageKey = 'oneul-todo-qa-v1';

      function row(name, detail, passed) {
        return '<div class="qa-item"><i class="qa-dot ' + (passed ? 'pass' : 'fail') + '" aria-hidden="true"></i><div class="qa-copy"><strong>' + name + '</strong><span>' + detail + '</span></div><span class="qa-result">' + (passed ? '통과' : '확인 필요') + '</span></div>';
      }

      function fetchText(path) {
        return fetch(path, { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error(path);
          return response.text();
        });
      }

      function run() {
        summaryElement.textContent = '점검 중…';
        Promise.all([
          fetchText('./index.html'),
          fetchText('./style.css'),
          fetchText('./script.js'),
          fetchText('./stage5.css'),
          fetchText('./stage5.js'),
          fetchText('./sw.js'),
          fetch('./manifest.webmanifest', { cache: 'no-store' }).then(function (response) { return response.json(); })
        ]).then(function (results) {
          var indexText = results[0];
          var cssText = results[1];
          var scriptText = results[2];
          var stage5Css = results[3];
          var stage5Script = results[4];
          var workerText = results[5];
          var manifest = results[6];
          var doc = new DOMParser().parseFromString(indexText, 'text/html');
          var tests = [
            ['필수 파일', 'HTML·CSS·JavaScript·PWA 파일을 모두 불러왔습니다.', Boolean(indexText && cssText && scriptText && stage5Css && stage5Script && workerText)],
            ['HTML 기본 구조', '한국어 문서, viewport, 본문 건너뛰기 링크를 확인합니다.', doc.documentElement.lang === 'ko' && Boolean(doc.querySelector('meta[name="viewport"]')) && Boolean(doc.querySelector('.skip-link'))],
            ['접근성 구조', 'main과 aria-modal 대화상자, 실시간 상태 영역을 확인합니다.', Boolean(doc.querySelector('main')) && Boolean(doc.querySelector('[aria-modal="true"]')) && Boolean(doc.querySelector('[aria-live]'))],
            ['PWA 설정', 'standalone 표시, 시작 주소, 192·512 아이콘을 확인합니다.', manifest.display === 'standalone' && manifest.start_url === './' && manifest.icons.some(function (icon) { return icon.sizes === '192x192'; }) && manifest.icons.some(function (icon) { return icon.sizes === '512x512'; })],
            ['오프라인 캐시', '5단계 CSS와 JavaScript가 앱 셸 캐시에 포함됐습니다.', workerText.indexOf("'./stage5.css'") > -1 && workerText.indexOf("'./stage5.js'") > -1 && workerText.indexOf('oneul-todo-v5') > -1],
            ['반응형 구간', '모바일·태블릿·데스크톱 분기 스타일을 확인합니다.', cssText.indexOf('max-width:1199px') > -1 && cssText.indexOf('max-width:767px') > -1 && cssText.indexOf('max-width:374px') > -1],
            ['브라우저 핵심 기능', 'IndexedDB, Promise, fetch, CSS Grid 지원을 확인합니다.', 'indexedDB' in window && 'Promise' in window && 'fetch' in window && window.CSS && typeof CSS.supports === 'function' && CSS.supports('display', 'grid')],
            ['5단계 보호 기능', '업데이트 처리와 미저장 이탈 방지 코드를 확인합니다.', stage5Script.indexOf('SKIP_WAITING') > -1 && stage5Script.indexOf('beforeunload') > -1 && stage5Script.indexOf('confirmDiscard') > -1]
          ];
          var passed = tests.filter(function (test) { return test[2]; }).length;
          checksElement.innerHTML = tests.map(function (test) { return row(test[0], test[1], test[2]); }).join('');
          summaryElement.textContent = passed + ' / ' + tests.length + ' 통과';
        }).catch(function () {
          checksElement.innerHTML = row('실행 환경', 'Live Server 또는 localhost로 이 페이지를 열어주세요.', false);
          summaryElement.textContent = '실행 환경 확인 필요';
        });
      }

      function loadManualState() {
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (error) {}
        Array.prototype.forEach.call(manualInputs, function (input) {
          input.checked = Boolean(saved[input.value]);
          input.addEventListener('change', saveManualState);
        });
      }

      function saveManualState() {
        var state = {};
        Array.prototype.forEach.call(manualInputs, function (input) { state[input.value] = input.checked; });
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) {}
      }

      document.getElementById('runQa').addEventListener('click', run);
      loadManualState();
      run();
    })();
  </script>
</body>
</html>
