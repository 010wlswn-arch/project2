<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>진달래 꽃</title>

<style>

*{
    margin:0;
    padding:0;
}

body{
    position:relative;
    width:100%;
    height:100vh;
    font-family:"맑은 고딕";
}

h1{
    text-align:center;
    margin-top:20px;
    font-size:28px;
}

h2{
    position:absolute;
    top:55px;
    right:40px;
    font-size:22px;
}

p{
    position:absolute;
    top:110px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    font-size:18px;
    line-height:2;
}

</style>

</head>

<body>

<h1>진달래 꽃</h1>

<h2>지은이 : 김소월</h2>

<p>
나 보기가<br>
역겨워<br>
가실 때에는<br><br>
말 없이<br>
고이<br>
보내 드리오리다<br><br>
영변에<br>
약산<br>
진달래 꽃<br><br>
진달래<br>
진달래 꽃<br>
피웠네
</p>

</body>
</html>
