<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>표준 웹 기술</title>

<style>
    /* 초기화 */
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    /* 박스 */
    .box{
        width:322px;
        border:1px solid #000;
        padding:38px 12px;
        margin:10px;
    }

    /* 제목 */
    h1{
        font-size:28px;
        font-weight:bold;
        margin-bottom:55px;
    }

    /* 문단 */
    p{
        margin-bottom:48px;
        font-size:18px;
        color:#0000ff;
        line-height:1;
    }

    /* 마지막 문단 */
    .last{
        margin-bottom:0;
    }

    /* 첫 글자 */
    span{
        font-size:52px;
        font-weight:bold;
        color:red;
        line-height:1;
    }
</style>

</head>

<body>

<div class="box">

    <h1>표준 웹 기술</h1>

    <p><span>H</span>TML</p>

    <p><span>C</span>SS</p>

    <p class="last"><span>J</span>avascript</p>

</div>

</body>
</html>
