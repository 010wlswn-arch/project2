<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="축하 메시지와 마음 전하실 곳"><title>방명록 | 민혁 ♥ 서영</title><link rel="stylesheet" href="./css/style.css"></head>
<body><a class="skip-link" href="#main">본문 바로가기</a><div class="app-shell"><main id="main" class="page">
  <header class="page-header reveal"><p class="eyebrow">Guestbook</p><h1 class="section-title">따뜻한 마음을<br>남겨주세요</h1><p class="section-copy">보내주신 마음은 오래도록 소중히 간직하겠습니다.</p></header>
  <section class="section compact"><form id="guestbook-form" class="card guest-form reveal" novalidate><div class="form-group"><label for="name">이름</label><input id="name" class="field" name="name" type="text" minlength="2" maxlength="20" autocomplete="name" placeholder="성함을 입력해 주세요" required></div><div class="form-group"><label for="side">관계</label><select id="side" class="field" name="side" required><option value="">선택해 주세요</option><option>신랑 측</option><option>신부 측</option><option>두 사람의 지인</option></select></div><div class="form-group"><label for="message">축하 메시지</label><textarea id="message" class="field" name="message" maxlength="200" placeholder="따뜻한 축하의 말을 남겨주세요" required></textarea><div class="field-meta"><span>최대 200자</span><span><b id="message-count">0</b> / 200</span></div></div><div aria-hidden="true" style="position:absolute;left:-9999px"><label for="website">웹사이트</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div><button id="guestbook-submit" class="button rose full" type="submit">축하 메시지 남기기</button><p id="form-status" class="form-status" role="status" aria-live="polite"></p></form><div id="guest-list" class="guest-list" aria-label="축하 메시지 목록"></div></section>
  <section class="section compact" style="background:#f8f0ec"><div class="reveal center"><p class="eyebrow">For your heart</p><h2 class="section-title">마음 전하실 곳</h2><p class="section-copy">참석이 어려우신 분들을 위해 안내드립니다.</p></div><div class="card reveal" style="margin-top:24px"><button class="account-toggle" type="button" data-account-toggle aria-expanded="false" aria-controls="groom-account"><span>신랑 측 계좌번호</span><span aria-hidden="true">＋</span></button><div id="groom-account" class="account-panel"><div class="account-line"><span><small>KB국민은행 · 김민혁</small>000000-00-000001</span><button class="copy-mini" type="button" data-copy="000000-00-000001" data-copy-message="신랑 측 계좌번호를 복사했어요.">복사</button></div></div><button class="account-toggle" type="button" data-account-toggle aria-expanded="false" aria-controls="bride-account"><span>신부 측 계좌번호</span><span aria-hidden="true">＋</span></button><div id="bride-account" class="account-panel"><div class="account-line"><span><small>KB국민은행 · 이서영</small>000000-00-000002</span><button class="copy-mini" type="button" data-copy="000000-00-000002" data-copy-message="신부 측 계좌번호를 복사했어요.">복사</button></div></div><p class="section-copy" style="margin-top:14px;font-size:11px">※ 실제 송금이 불가능한 예시용 가상 계좌번호입니다.</p></div></section>
</main><nav class="bottom-nav" aria-label="청첩장 화면"><a href="./index.html"><span class="nav-icon">⌂</span><span>초대</span></a><a href="./story.html"><span class="nav-icon">♡</span><span>이야기</span></a><a href="./gallery.html"><span class="nav-icon">▧</span><span>사진</span></a><a href="./venue.html"><span class="nav-icon">⌖</span><span>안내</span></a><a href="./guestbook.html" aria-current="page"><span class="nav-icon">✎</span><span>방명록</span></a></nav></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="./js/config.js"></script><script src="./js/main.js"></script><script src="./js/guestbook.js"></script></body></html>
