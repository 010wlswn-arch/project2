<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 폼</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:#ffffff;
    font-family:"맑은 고딕", sans-serif;
    color:#333;
}

.wrap{
    width:750px;
    margin:18px auto 0;
}

.wrap > h1{
    font-size:34px;
    font-weight:700;
    color:#444;
    margin-bottom:16px;
}

.login-box{
    width:750px;
    height:563px;
    border:1px solid #ddd;
    border-radius:8px;
    padding-top:43px;
}

.login-box h2{
    text-align:center;
    font-size:44px;
    font-weight:700;
    color:#444;
    margin-bottom:31px;
}

form{
    width:420px;
    margin:0 auto;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    font-size:19px;
    margin-bottom:9px;
}

.input-group input{
    display:block;
    width:420px;
    height:69px;
    border:1px solid #ccc;
    padding:0 15px;
    font-size:18px;
    outline:none;
    background-color:#fff;
}

.input-group input:focus{
    border-color:#888;
}

button{
    width:420px;
    height:64px;
    border:0;
    background-color:#292929;
    color:#ffffff;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    margin-top:6px;
}
    </style>
</head>
<body>

    <div class="wrap">

        <h1>실습 결과</h1>

        <div class="login-box">

            <h2>로그인</h2>

            <form>

                <div class="input-group">
                    <label for="user-id">아이디</label>
                    <input type="text" id="user-id">
                </div>

                <div class="input-group">
                    <label for="user-pw">비밀번호</label>
                    <input type="password" id="user-pw">
                </div>

                <button type="submit">로그인</button>

            </form>

        </div>

    </div>

</body>
</html>
